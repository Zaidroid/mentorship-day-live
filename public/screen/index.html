<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mentorship Day Live Screen</title>
<link rel="preload" href="/assets/ss3-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:SS3;font-weight:300;src:url(/assets/ss3-300.woff2) format('woff2')}
@font-face{font-family:SS3;font-weight:400;src:url(/assets/ss3-400.woff2) format('woff2')}
@font-face{font-family:SS3;font-weight:600;src:url(/assets/ss3-600.woff2) format('woff2')}
@font-face{font-family:SS3;font-weight:700;src:url(/assets/ss3-700.woff2) format('woff2')}
@font-face{font-family:SS3;font-weight:900;src:url(/assets/ss3-900.woff2) format('woff2')}
/* Motion tokens (docs/PLAN.md 7.2). The same values live in M in the script. */
:root{--red:#DF6236;--teal:#2F9CC3;--navy:#1F2E33;--orange:#E78B3F;--u:10px;--ease:cubic-bezier(.2,.8,.2,1);--ease-io:cubic-bezier(.65,0,.25,1);--t-s:240ms;--t-e:520ms;--t-x:900ms}
[data-theme=light]{--glass-solid:rgba(250,250,250,.86);--bg1:#E3E3E3;--bg2:#F7F7F7;--ink:#1F2E33;--ink2:rgba(31,46,51,.70);--ink3:rgba(31,46,51,.44);--line:rgba(31,46,51,.14);--glass:rgba(255,255,255,.64);--glassline:rgba(255,255,255,.95);--shadow:0 calc(var(--u)*.6) calc(var(--u)*2.6) rgba(31,46,51,.07);--soft2:rgba(31,46,51,.08);--chip:transparent;--redsoft:rgba(223,98,54,.12)}
[data-theme=dark]{--glass-solid:rgba(41,55,60,.86);--bg1:#1F2E33;--bg2:#162226;--ink:#FFFFFF;--ink2:rgba(255,255,255,.72);--ink3:rgba(255,255,255,.44);--line:rgba(255,255,255,.14);--glass:rgba(255,255,255,.06);--glassline:rgba(255,255,255,.10);--shadow:none;--soft2:rgba(255,255,255,.10);--chip:#FFFFFF;--redsoft:rgba(223,98,54,.22)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;color:var(--ink);font-family:SS3,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;background:linear-gradient(180deg,var(--bg1),var(--bg2));transition:color var(--t-x) var(--ease)}
/* Masked text: each line sits in its own clip and rises from behind its lower edge. The clip reaches past
   the line box so descenders are never cut, and is lifted (.ok) once the line has arrived. */
.ln{display:block;overflow:hidden;padding:.12em 0 .2em;margin:-.12em 0 -.2em}
.ln.ok{overflow:visible}
.li{display:inline-block;white-space:nowrap}
.li.lb{display:block;white-space:inherit}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block}
#app{position:fixed;inset:0;display:grid;grid-template-columns:calc(var(--u)*var(--nowW)) minmax(0,1fr) calc(var(--u)*var(--railW));grid-template-rows:minmax(0,1fr) calc(var(--u)*11.5) calc(var(--u)*8.2);column-gap:calc(var(--u)*3);padding:calc(var(--u)*3.2) calc(var(--u)*3.4) 0}
#app[data-layout=standard]{grid-template-columns:calc(var(--u)*var(--nowW)) minmax(0,1fr) 0}
#app[data-layout=standard] #rail{display:none}
.glass{background:var(--glass);border:1px solid var(--glassline);border-radius:10px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.leaf{border-radius:calc(var(--u)*.7) calc(var(--u)*3) 0 calc(var(--u)*3)}
/* lite: set by the performance governor. Glass becomes a solid fill, no backdrop blur anywhere */
[data-lite] .glass:not(.free){backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--glass-solid)}
[data-lite] *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}

/* Now zone */
#now{display:flex;flex-direction:column;min-height:0;padding:calc(var(--u)*2.6) calc(var(--u)*2.8) calc(var(--u)*2.4)}
.wm h1{font-weight:700;font-size:calc(var(--u)*4.4);line-height:1;color:var(--red);letter-spacing:-.01em;white-space:nowrap}
.wm i{display:block;height:calc(var(--u)*.55);background:var(--teal);margin-top:calc(var(--u)*1.2);width:100%}
.wm span{display:block;font-size:calc(var(--u)*1.6);color:var(--ink2);margin-top:calc(var(--u)*1.1)}
.clock{margin-top:auto;font-weight:300;font-size:calc(var(--u)*14.5);line-height:.82;letter-spacing:-.035em;display:flex;align-items:flex-start;color:var(--ink)}
.clock sup{font-size:.26em;font-weight:600;letter-spacing:0;color:var(--ink3);margin:calc(var(--u)*1) 0 0 calc(var(--u)*.9)}
.status{margin-top:calc(var(--u)*3.2)}
.st-label{display:flex;align-items:center;gap:calc(var(--u)*1);font-weight:700;font-size:calc(var(--u)*2.6);line-height:1.1}
.st-label.on{color:var(--red)}
.live-dot{width:calc(var(--u)*1.2);height:calc(var(--u)*1.2);border-radius:50%;background:var(--red);flex:none;position:relative}
.live-dot:after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--red);animation:ping 2s var(--ease) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.6}80%,100%{transform:scale(2.6);opacity:0}}
.st-cd{display:flex;align-items:baseline;gap:calc(var(--u)*1.2);margin-top:calc(var(--u)*1.2)}
.st-cd b{font-weight:300;font-size:calc(var(--u)*7);line-height:1;letter-spacing:-.02em}
.st-cd span{font-size:calc(var(--u)*1.8);color:var(--ink2)}
.prog{height:calc(var(--u)*.55);background:var(--soft2);overflow:hidden;margin-top:calc(var(--u)*1.5)}
.prog i{display:block;height:100%;width:0;background:var(--red);transition:width 1s linear}
.st-next{margin-top:calc(var(--u)*1.7);font-size:calc(var(--u)*1.8);color:var(--ink2);line-height:1.35}
.st-next b{color:var(--ink);font-weight:700}
.logos{margin-top:auto;display:flex;flex-direction:column;gap:calc(var(--u)*1.4);padding-top:calc(var(--u)*2.4)}
.logos div{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*1.6);background:var(--chip);border-radius:10px;padding:calc(var(--u)*.4) calc(var(--u)*.6)}
.logos img{display:block;width:auto}

/* Stage */
#stage{position:relative;min-width:0;min-height:0;display:flex;gap:calc(var(--u)*3)}
.slot{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.sh{display:flex;align-items:flex-end;gap:calc(var(--u)*2);margin:calc(var(--u)*.6) 0 calc(var(--u)*2.2)}
.sh h2{font-weight:700;font-size:calc(var(--u)*3.4);line-height:1;color:var(--red);white-space:nowrap}
.sh .rule{position:absolute}
.pager{margin-left:auto;display:flex;gap:calc(var(--u)*1.8);font-size:calc(var(--u)*1.5);font-weight:600;color:var(--ink3)}
.pager span{position:relative;padding-bottom:calc(var(--u)*.7);white-space:nowrap;transition:color var(--t-s) var(--ease)}
.pager span.on{color:var(--ink)}
.pager span.on:after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--teal);transform-origin:left;transform:scaleX(var(--p,0));transition:transform 1s linear}
.shrule{height:calc(var(--u)*.4);background:var(--teal);margin:calc(var(--u)*-1) 0 calc(var(--u)*2.4);width:calc(var(--u)*12)}
.sb{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}

/* shared */
.av{border-radius:50%;object-fit:cover;flex:none;background:var(--soft2);display:grid;place-items:center;font-weight:700;color:var(--ink2);box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.dl{display:inline-flex;align-items:center;gap:calc(var(--u)*.6);font-size:calc(var(--u)*1.5);font-weight:600;color:var(--ink2);white-space:nowrap}
.dl:before{content:"";width:calc(var(--u)*.9);height:calc(var(--u)*.9);border-radius:50%;background:var(--red)}
.dl.on:before{background:var(--teal)}
.pill{display:inline-flex;align-items:center;font-weight:700;color:#fff;background:var(--red);white-space:nowrap;line-height:1}
.pill.blue{background:var(--teal)}
.pill.ghost{background:transparent;color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.pill.ghost.blue{color:var(--teal);box-shadow:inset 0 0 0 2px var(--teal)}
.pill.mute{background:var(--soft2);color:var(--ink3)}
.bar{height:calc(var(--u)*.5);background:var(--soft2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);transition:width var(--t-x) var(--ease)}
.bar.hot i{background:var(--red)}
.muted{color:var(--ink2)}

/* rooms */
.rooms{display:grid;flex:1;min-height:0;gap:calc(var(--u)*2)}
.room{display:flex;flex-direction:column;gap:calc(var(--u)*1.4);min-height:0;min-width:0;padding:calc(var(--u)*2.2) calc(var(--u)*2.4)}
.room .top{display:flex;align-items:center;gap:calc(var(--u)*1.4);flex-wrap:wrap}
.room .top .pill{font-size:calc(var(--u)*2.2);padding:calc(var(--u)*1) calc(var(--u)*2)}
.room .top em{font-style:normal;font-weight:600;font-size:calc(var(--u)*1.6);color:var(--ink2)}
.room .top em.on{color:var(--red)}
.room .ttl{font-weight:700;line-height:1.13;text-wrap:balance}
.room .who{display:flex;align-items:center;gap:calc(var(--u)*1.2);margin-top:calc(var(--u)*.4)}
.room .who b{display:block;font-weight:700;font-size:calc(var(--u)*1.85);line-height:1.15}
.room .who span{display:block;font-size:calc(var(--u)*1.4);color:var(--ink2);line-height:1.25}
.room .seats{margin-top:auto;display:flex;align-items:center;gap:calc(var(--u)*1.2);font-size:calc(var(--u)*1.45);color:var(--ink2)}
.room .seats .bar{flex:1}
.room.free{background:transparent;border:2px dashed var(--line);box-shadow:none;backdrop-filter:none}
.room.free .ttl{color:var(--ink3);font-weight:600;font-size:calc(var(--u)*2)}
.room.live{box-shadow:var(--shadow),inset 0 calc(var(--u)*.5) 0 var(--red)}
.stack{display:flex}
.stack>*+*{margin-left:calc(var(--u)*-1.4)}

/* choose grid */
.cg{display:grid;flex:1;min-height:0}
.cg .hd{padding:0 calc(var(--u)*.7) calc(var(--u)*1.2)}
.cg .hd .pill{font-size:calc(var(--u)*1.9);padding:calc(var(--u)*.9) calc(var(--u)*1.8);width:100%}
.cg .tm{border-top:1px solid var(--line);padding:calc(var(--u)*1.4) calc(var(--u)*1) 0 0}
.cg .tm b{display:block;font-weight:700;font-size:calc(var(--u)*3.2);line-height:1}
.cg .c{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:calc(var(--u)*1.4);display:flex;flex-direction:column;gap:calc(var(--u)*.8);min-height:0;overflow:hidden}
.cg .c .s{font-weight:700;font-size:calc(var(--u)*1.9);line-height:1.15;text-wrap:balance}
.cg .c .p{display:flex;align-items:center;gap:calc(var(--u)*.8);font-size:calc(var(--u)*1.5);color:var(--ink2);margin-top:auto}
.cg .c .m{display:flex;align-items:center;gap:calc(var(--u)*1.2);font-size:calc(var(--u)*1.4);color:var(--ink2)}
.cg .c .m .bar{flex:1}
.cg .c.free{color:var(--ink3);font-size:calc(var(--u)*1.6);justify-content:center}

/* one to one chips */
.oo{display:flex;flex-direction:column;gap:calc(var(--u)*1.5)}
.oo-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:calc(var(--u)*1.2)}
.oo-who{display:flex;align-items:center;gap:calc(var(--u)*1);min-width:0}
.oo-who b{font-weight:700;font-size:calc(var(--u)*1.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.oo-who span{font-size:calc(var(--u)*1.3);color:var(--ink2);display:block;white-space:nowrap}
.chips{display:flex;gap:calc(var(--u)*.6)}
.chp{width:calc(var(--u)*6.4);height:calc(var(--u)*3.4);border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:calc(var(--u)*1.45);border:2px solid var(--teal);color:var(--ink);background:rgba(255,255,255,.5);transition:border-color var(--t-e) var(--ease),background-color var(--t-e) var(--ease),color var(--t-e) var(--ease)}
.chips.sm .chp{width:calc(var(--u)*5.6);height:calc(var(--u)*3.1);font-size:calc(var(--u)*1.35)}
.chp.taken{border-color:transparent;background:var(--soft2);color:var(--ink3)}
.chp.now{border-color:var(--red);background:var(--red);color:#fff}
.chp.done{border-color:transparent;background:transparent;color:var(--ink3);text-decoration:line-through}
.legend{display:flex;gap:calc(var(--u)*1.8);font-size:calc(var(--u)*1.35);color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:calc(var(--u)*1.3);height:calc(var(--u)*1.3);border-radius:3px;margin-right:calc(var(--u)*.5);vertical-align:-.12em;border:2px solid var(--teal)}
.legend i.t{border-color:transparent;background:var(--soft2)}
.legend i.n{border-color:var(--red);background:var(--red)}

/* rail */
#rail{display:flex;flex-direction:column;gap:calc(var(--u)*1.8);min-height:0}
.mod{padding:calc(var(--u)*2) calc(var(--u)*2.2)}
.mod h3{display:flex;align-items:baseline;justify-content:space-between;font-weight:700;font-size:calc(var(--u)*2.1);margin-bottom:calc(var(--u)*1.6)}
.mod h3 em{font-style:normal;font-weight:300;font-size:calc(var(--u)*3.8);line-height:.8;color:var(--teal)}
.mod .foot{margin-top:calc(var(--u)*1.4);font-size:calc(var(--u)*1.45);color:var(--ink2)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.8)}
.kpi b{display:block;font-weight:300;font-size:calc(var(--u)*5.2);line-height:.9;letter-spacing:-.02em}
.kpi span{display:block;font-size:calc(var(--u)*1.45);color:var(--ink2);margin-top:calc(var(--u)*.7)}
.qrrow{display:flex;gap:calc(var(--u)*1.8);align-items:center}
.qr{background:#fff;border-radius:10px;padding:calc(var(--u)*.9);flex:none;box-shadow:var(--shadow)}
.qr svg{display:block;width:100%;height:100%}
.qrph{flex:none;border:2px dashed var(--ink3);border-radius:10px;display:grid;place-items:center;text-align:center;color:var(--ink3);font-weight:700;font-size:calc(var(--u)*1.4);line-height:1.3}
.qrtxt b{display:block;font-weight:700;font-size:calc(var(--u)*2);line-height:1.2}
.qrtxt span{display:block;font-size:calc(var(--u)*1.5);color:var(--ink2);margin-top:calc(var(--u)*.6);line-height:1.3}

/* spotlight */
.spot{flex:1;display:grid;align-items:center;gap:calc(var(--u)*3.6)}
/* .pic, not .ph: .ph is the Photo Wall tile, whose rules collapsed this box in version 1 */
.spot .pic{position:relative;justify-self:center}
.spot .pic svg.ring{position:absolute;inset:calc(var(--u)*-1.3);width:calc(100% + var(--u)*2.6);height:calc(100% + var(--u)*2.6);transform:rotate(-90deg)}
.spot .pic svg.ring circle{fill:none;stroke-width:1.4}
@keyframes ring{to{stroke-dashoffset:0}}
.spot .pic .av{box-shadow:0 calc(var(--u)*1) calc(var(--u)*3) rgba(31,46,51,.18)}
.spot .kick{font-size:calc(var(--u)*1.9);color:var(--ink2)}
.spot .nm{font-weight:700;font-size:calc(var(--u)*5.4);line-height:1;letter-spacing:-.01em;color:var(--red);margin-top:calc(var(--u)*.6)}
.spot .rule{height:calc(var(--u)*.45);background:var(--teal);width:calc(var(--u)*14);margin-top:calc(var(--u)*1.6)}
.spot .rl{font-size:calc(var(--u)*1.9);color:var(--ink2);margin-top:calc(var(--u)*1.4)}
.spot .ss{font-weight:700;font-size:calc(var(--u)*2.6);line-height:1.2;margin-top:calc(var(--u)*2.2);text-wrap:balance}
.spot .meta{display:flex;gap:calc(var(--u)*1.4);align-items:center;margin-top:calc(var(--u)*1.8);flex-wrap:wrap}
.spot .meta .pill{font-size:calc(var(--u)*1.7);padding:calc(var(--u)*.7) calc(var(--u)*1.5)}
.spot .count{margin-top:calc(var(--u)*2.4);display:flex;gap:calc(var(--u)*.6)}
.spot .count i{width:calc(var(--u)*2.2);height:3px;background:var(--soft2)}
.spot .count i.on{background:var(--red)}

/* wall */
.wall{flex:1;display:grid;align-content:center;gap:calc(var(--u)*2.4) calc(var(--u)*1.6)}
.wall .w{display:flex;flex-direction:column;align-items:center;text-align:center;gap:calc(var(--u)*.9);transition:transform var(--t-e) var(--ease),opacity var(--t-e) var(--ease)}
.wall .w b{font-size:calc(var(--u)*1.6);font-weight:700;line-height:1.15}
.wall .w span{font-size:calc(var(--u)*1.3);color:var(--ink2)}
.wall .w .av{transition:box-shadow var(--t-e) var(--ease)}
.wall.hl .w{opacity:.45}
.wall.hl .w.on{opacity:1;transform:scale(1.08)}
.wall.hl .w.on .av{box-shadow:0 0 0 3px #fff,0 0 0 7px var(--red)}

/* poll */
.poll{flex:1;min-height:0;display:grid;gap:calc(var(--u)*3)}
.cloud{position:relative;min-height:0;min-width:0}
.cloud span{position:absolute;white-space:nowrap;font-weight:700;line-height:1;transform:translate(-50%,-50%);transition:left var(--t-x) var(--ease),top var(--t-x) var(--ease),font-size var(--t-x) var(--ease)}
/* a new word rises from behind its own edge, like every other text */
.cloud span{padding:.16em 0}
.cloud span.new{overflow:hidden}
.cloud span i{display:inline-block;font-style:normal}
.empty{display:grid;place-items:center;text-align:center;color:var(--ink3);font-size:calc(var(--u)*2);line-height:1.4}

/* hero, speaker, recap */
.hero{flex:1;display:flex;flex-direction:column;justify-content:center}
.hero .k{font-size:calc(var(--u)*3.6);font-weight:400;line-height:1.1}
.hero h1{font-weight:700;line-height:.95;letter-spacing:-.02em;color:var(--red);margin-top:calc(var(--u)*.8)}
.hero .rule{height:calc(var(--u)*.9);background:var(--teal);margin-top:calc(var(--u)*2.6)}
.hero p{font-size:calc(var(--u)*2.5);color:var(--ink);line-height:1.4;margin-top:calc(var(--u)*3);max-width:calc(var(--u)*80)}
.hero .feat{display:flex;gap:calc(var(--u)*3.4);margin-top:calc(var(--u)*3.4);flex-wrap:wrap}
.hero .feat span{display:flex;align-items:center;gap:calc(var(--u)*1.1);font-size:calc(var(--u)*2.2);font-weight:600}
.hero .feat span:before{content:"";width:calc(var(--u)*1.1);height:calc(var(--u)*1.1);border-radius:50%;background:var(--red)}
.speaker{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:calc(var(--u)*6)}
.speaker .k{font-size:calc(var(--u)*3);color:var(--ink2)}
.speaker .nm{font-weight:700;line-height:.92;letter-spacing:-.02em;color:var(--red);margin-top:calc(var(--u)*1)}
.speaker .rule{height:calc(var(--u)*.8);background:var(--teal);margin-top:calc(var(--u)*2.4);width:70%}
.speaker .org{font-weight:700;font-size:calc(var(--u)*3.4);margin-top:calc(var(--u)*2.4)}
.speaker .what{font-size:calc(var(--u)*2.4);color:var(--ink2);margin-top:calc(var(--u)*.8)}
.sl{display:flex;flex-direction:column;min-width:calc(var(--u)*40);padding:calc(var(--u)*1.4) calc(var(--u)*2.4)}
.sl>div{display:grid;grid-template-columns:calc(var(--u)*8) 1fr;gap:calc(var(--u)*1.2);padding:calc(var(--u)*1.5) 0;transition:opacity var(--t-e) var(--ease)}
.sl>div+div{border-top:1px solid var(--line)}
.sl>div>b{font-weight:700;font-size:calc(var(--u)*2.2);color:var(--ink2)}
.sl>div strong{display:block;font-weight:700;font-size:calc(var(--u)*2.1)}
.sl>div span{display:block;font-size:calc(var(--u)*1.5);color:var(--ink2)}
.sl>div.past{opacity:.38}
.sl>div.on strong,.sl>div.on>b{color:var(--red)}
.recap{flex:1;display:flex;flex-direction:column;justify-content:center}
.recap .kpis{grid-template-columns:repeat(4,minmax(calc(var(--u)*17),auto));justify-content:start;gap:calc(var(--u)*3);margin-top:calc(var(--u)*4)}
.recap .kpi b{font-size:calc(var(--u)*7.4);color:var(--ink)}

/* garden timeline */
#garden{grid-column:1/-1;position:relative;margin:0 calc(var(--u)*-3.4)}
.fl{position:absolute;bottom:0;width:calc(var(--u)*3.4);height:calc(var(--u)*8);transform-origin:50% 100%;transition:opacity var(--t-e) var(--ease)}

<script>
(function(){
'use strict';
// day.js sets window.MD_DAY. A copy is kept, so a page that cannot load it still has the day.
const DAY = (() => { const d = window.MD_DAY; if (d) { try { localStorage.setItem('md_day', JSON.stringify(d)); } catch(e) {} return d; } try { return JSON.parse(localStorage.getItem('md_day')); } catch(e) { return null; } })();
if (!DAY) { setTimeout(() => location.reload(), 10000); return; }
const A = {mc:'/assets/mercycorps.png', gsg:'/assets/gsg.png', sida:'/assets/sida.png', tp:'/assets/technopark.png', pis:'/assets/pis.png'};

/* ============ Settings ============ */
const CONFIG = {
  feedSheet: '1xOXRmAqi5NqVaLL-IkoEKC7H9eguoc5-idOxpNcbiAY',
  links: { survey:'' },
  join: (location.protocol.startsWith('http') && !/^(localhost|127\.)/.test(location.hostname)) ? location.origin + '/' : 'https://mentorship-day-live.netlify.app/',
  hashtag: '#MentorshipDay',
  theme: 'light',
  refreshSeconds: 60,   // sheet tabs (docs/PLAN.md 5.12: the polling numbers are a budget)
  stateSeconds: 3,
  beatSeconds: 60
};

/* ============ Schedule, built from /assets/day.js ============ */
const ADVISORS = {}; Object.keys(DAY.advisors).forEach(k => { ADVISORS[k] = Object.assign({}, DAY.advisors[k]); });
const ROOMS = DAY.rooms.slice();
const BLOCKS = DAY.blocks.map(b => Object.assign({}, b));
let SESSIONS = DAY.sessions.map(s => Object.assign({}, s, {who:s.who.slice(), booked:0, ok:true}));
const FOCUS = {}; DAY.ones.forEach(o => { FOCUS[o.who] = o.focus; });
function slotsFor(who, room, start, end, mode){ const o = []; for (let m = toMin(start); m + 15 <= toMin(end); m += 15) o.push({who, room, s:fmt(m), e:fmt(m+15), mode, status:'Open'}); return o; }
let SLOTS = [].concat(...DAY.ones.map(o => slotsFor(o.who, o.room, o.s, o.e, o.mode)));
const PROGRAM = DAY.program.map(p => ({s:p.s, e:p.e, title:p.title, sub:p.sub, mode:p.mode}));
const SPEAKERS = DAY.speakers.map(x => Object.assign({}, x));
const VIDEOS = DAY.videos.map(v => v.title);

/* ============ Time ============ */
// The wall shows venue time (MD_DAY.tz), whatever time zone the computer is set to.
// It keeps its own clock, unless a fresh state t differs from it by more than 15 seconds
// (a wrong clock on the wall computer, or a rehearsal): then it runs on Date.now() + skew.
// ?t=HH:MM[:SS] wins over everything. ?speed=N runs the clock faster, for tests.
const P = new URLSearchParams(location.search);
const speed = Math.max(1, +P.get('speed') || 1), t0 = Date.now();
const TZF = (() => { try { return new Intl.DateTimeFormat('en-US', {timeZone:DAY.tz, hourCycle:'h23', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit'}); } catch(e) { return null; } })();
let tzOff = 0, tzAt = -1e13;
function tzOffset(ms){ // venue wall time minus UTC, in ms, looked up again every 10 minutes
  if (Math.abs(ms - tzAt) < 6e5) return tzOff; tzAt = ms;
  if (!TZF) { tzOff = -new Date(ms).getTimezoneOffset() * 60000; return tzOff; }
  const p = {}; TZF.formatToParts(new Date(ms)).forEach(x => { p[x.type] = x.value; });
  tzOff = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second) - Math.floor(ms / 1000) * 1000; return tzOff;
}
let fakeBase = null;
if (P.get('t')) { const [h,m,s] = P.get('t').split(':').map(Number), n = Date.now(), v = new Date(n + tzOffset(n)); fakeBase = Date.UTC(v.getUTCFullYear(), v.getUTCMonth(), v.getUTCDate(), h || 0, m || 0, s || 0) - tzOffset(n); }
const CLOCK = {skew:0, use:false};
function nowMs(){ const off = CLOCK.use ? CLOCK.skew : 0; if (fakeBase !== null) return fakeBase + (Date.now() - t0) * speed; return (speed === 1 ? Date.now() : t0 + (Date.now() - t0) * speed) + off; }
function venue(){ const ms = nowMs(), d = new Date(ms + tzOffset(ms)); return {h:d.getUTCHours(), m:d.getUTCMinutes(), s:d.getUTCSeconds(), ms:d.getUTCMilliseconds(), t:ms}; }
function toMin(s){ const [h,m] = String(s).split(':').map(Number); return h*60 + m; }
function fmt(m){ return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(Math.round(m%60)).padStart(2,'0'); }
function nowMin(){ const v = venue(); return v.h*60 + v.m + v.s/60 + v.ms/60000; }
function mmss(sec){ sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return (h ? h + ':' + String(m).padStart(2,'0') : String(m)) + ':' + String(s).padStart(2,'0'); }

/* ============ Performance governor ============ */
// Frame time is measured for the first 6 seconds (after 1.5 seconds of warm up, while fonts and photos
// load) and then over the last 120 frames. When the average stays over 22 ms for 3 seconds, the wall goes
// lite for the rest of the session: no backdrop blur (glass becomes a solid fill), no blur in reveals,
// half the background nodes, at most 30 effect particles. The background keeps moving.
// ?lite=1 and ?lite=0 force it. A gap over 250 ms is a pause (hidden page), not a slow frame.
const GOV = {force:/^[01]$/.test(P.get('lite') || '') ? P.get('lite') : null, lite:false, why:'', fps:null, avg:0, buf:[], sum:0, t0:0, last:0, slow:0, at:0,
  WARM:1500, FIRST:6000, ROLL:120, LIMIT:22, HOLD:3000};
function goLite(why){ if (GOV.lite) return; GOV.lite = true; GOV.why = why; GOV.at = Date.now(); document.documentElement.dataset.lite = ''; }
function govFrame(t){
  requestAnimationFrame(govFrame);
  if (!GOV.t0) { GOV.t0 = GOV.last = t; return; }
  const dt = t - GOV.last; GOV.last = t;
  if (t - GOV.t0 < GOV.WARM || dt > 250) return;
  GOV.buf.push(dt); GOV.sum += dt;
  if (t - GOV.t0 > GOV.WARM + GOV.FIRST) while (GOV.buf.length > GOV.ROLL) GOV.sum -= GOV.buf.shift();
  GOV.avg = GOV.sum / GOV.buf.length; GOV.fps = Math.round(1000 / GOV.avg);
  if (GOV.lite || GOV.force || GOV.buf.length < 10) return;
  if (GOV.avg > GOV.LIMIT) { if (!GOV.slow) GOV.slow = t; else if (t - GOV.slow >= GOV.HOLD) goLite(`average frame ${GOV.avg.toFixed(1)} ms for 3 seconds`); } else GOV.slow = 0;
}
if (GOV.force === '1') goLite('lite=1 in the URL');
requestAnimationFrame(govFrame);

/* ============ State ============ */
// Theme: theme= in the URL wins over everything until the T key is pressed. Otherwise the sheet's Theme,
// then the latest of the remote's cfg.theme and the T key.
const S = {mode:null, override:P.get('mode'), demo:P.has('demo'), ann:'', speaker:null, live:false, checkedIn:null, poll:[], urlTheme:/^(light|dark)$/.test(P.get('theme') || '') ? P.get('theme') : null, theme:CONFIG.theme, cfgTheme:null, sheetScene:'', sheetTheme:'', sheetSpeaker:'', wifi:{name:'', pass:''}, plan:'', seen:new Set(), dataKey:'', momentKey:'', annShown:''};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let U = 10;
const adv = k => ADVISORS[k] || {name:k, role:'', photo:null};
const initials = n => n.split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase();
function av(k, size){ const a = adv(k); if (a.noPhoto) return ''; const st = `width:calc(var(--u)*${size});height:calc(var(--u)*${size});font-size:calc(var(--u)*${(size*0.36).toFixed(2)})`; return a.photo ? `<img class="av" style="${st}" src="${a.photo}" alt="">` : `<div class="av" style="${st}">${esc(initials(a.name))}</div>`; }

function qrSvg(text){ try { const q = qrcode(0, 'M'); q.addData(text); q.make(); const n = q.getModuleCount(); let p = ''; for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) p += `M${c},${r}h1v1h-1z`; return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path d="${p}" fill="#1F2E33"/></svg>`; } catch(e) { return ''; } }

function layoutCloud(el){
  const box = el.querySelector('[data-cloud]'); if (!box || !S.poll.length) return;
  const W = box.clientWidth, H = box.clientHeight; if (!W || !H) return;
  const words = S.poll.slice(0, 40), max = words[0][1], cv = document.createElement('canvas').getContext('2d'), placed = [];
  const scale = Math.min(1, Math.sqrt(W * H) / (U * 60)); let html = '';
  words.forEach(([t, n], i) => {
    const fs = U * (1.8 + 5.2 * Math.sqrt(n / max)) * scale; cv.font = `700 ${fs}px SS3`;
    const w = cv.measureText(t).width + fs * .3, h = fs * 1.05; let x = W / 2, y = H / 2, ok = false;
    for (let k = 0; k < 1400 && !ok; k++) { const a = k * .35, r = k * .9 * (U / 10); x = W / 2 + r * Math.cos(a) * 1.5; y = H / 2 + r * Math.sin(a) * .85;
      if (x - w / 2 < 0 || x + w / 2 > W || y - h / 2 < 0 || y + h / 2 > H) continue;
      ok = !placed.some(p => Math.abs(p.x - x) < (p.w + w) / 2 && Math.abs(p.y - y) < (p.h + h) / 2); }
    if (!ok) return; placed.push({x, y, w, h});

  });

}

/* ============ Motion ============ */
// One set of tokens, one treatment per kind of thing, used everywhere (docs/PLAN.md 7.2):
//   scene change    the old scene recedes (to scale .97 and out), the new one comes forward (scale 1.06 to 1, a small rise)
//   blocks   .rv    come forward the same way, 520 ms
//   text     .tx    each line rises from behind its own clipped edge. Text never fades in
//   leaves   .lf    leaf pills unfold from their square corner (bottom right)
//   rules    .dr    blue rules draw from the left
//   numbers         count up ([data-count])
// Stagger 55 ms per item, up to 14 items. No bounce. Transform, opacity and clip only; blur only on a big
// photo, never in lite. With prefers-reduced-motion everything simply appears.
const M = {s:240, e:520, x:900, stag:55, max:14, out:'cubic-bezier(.2,.8,.2,1)', io:'cubic-bezier(.65,0,.25,1)'};

const still = () => RM.matches;
// Splits the text of each element into the lines it has now, each line in its own clip (.ln > .li).
// An element with child elements rises as one block. Three passes, so the page lays out once for all.
function splitLines(els){
  const plain = [];
  els.forEach(el => {
    if (el.dataset.ln) return; el.dataset.ln = '1';
    const t = el.textContent; if (!t.trim()) return;
    if (el.children.length) { el.innerHTML = `<span class="ln"><span class="li lb">${el.innerHTML}</span></span>`; return; }
    plain.push(el); el.innerHTML = t.trim().split(/\s+/).map(w => `<span>${esc(w)}</span>`).join(' ');
  });
  const lines = plain.map(el => { const out = []; let top = null; [...el.children].forEach(w => { const y = w.offsetTop; if (top === null || y - top > 2) { out.push([]); top = y; } out[out.length - 1].push(w.textContent); }); return out; });
  plain.forEach((el, i) => { el.innerHTML = lines[i].map(l => `<span class="ln"><span class="li">${esc(l.join(' '))}</span></span>`).join(''); });
}
const lift = a => { const ln = a.effect.target.parentNode; a.finished.then(() => ln.classList.add('ok'), () => {}); };
function riseLine(li, delay, dur){ const a = li.animate([{transform:'translateY(110%)'}, {transform:'none'}], {duration:dur || M.e, delay, easing:M.out, fill:'backwards'}); lift(a); return a; }

  for (const [k, fn] of JOBS) { const u = feedUrl(k); if (!u) continue; tried++; try { const rows = await getCSV(u); fn(rows); ok++; try { localStorage.setItem('md4_' + k, JSON.stringify(rows)); } catch(e) {} } catch(e) {} }
  S.live = tried > 0 && ok === tried;
  loop(true); }
function restore(){ try { const v = localStorage.getItem('md4_snap'); if (v) { const x = JSON.parse(v); applySnap(x.v, x.d); } } catch(e) {} try { const v = localStorage.getItem('md4_state'); if (v) applyState(JSON.parse(v), true); } catch(e) {} JOBS.forEach(([k, fn]) => { if (!feedUrl(k)) return; try { const v = localStorage.getItem('md4_' + k); if (v) fn(JSON.parse(v)); } catch(e) {} }); }

/* ============ Demo ============ */
const DEMO_WORDS = ['clients','funding','confidence','network','clarity','growth','mentors','sales','strategy','leadership','visibility','pitch','focus','partners','ideas','direction','courage','markets','branding','skills','connections','execution','feedback','vision','momentum','investors'];
function demo(){ if (!S.demo) return; const m = nowMin();
  S.checkedIn = Math.max(0, Math.min(104, Math.round((m - toMin('09:25')) * 2.6))) || null;
  const f = Math.max(0, Math.min(1, (m - 575) / 90)); SESSIONS.forEach((s, i) => { s.booked = Math.round(s.seats * f * (.42 + .08 * i)); });
  SLOTS.forEach((x, i) => { x.status = (i % 3 !== 2 && m > 600 + i * 2) ? 'Booked' : 'Open'; });
  const n = Math.max(0, Math.min(DEMO_WORDS.length, Math.floor((m - 570) / 4))); if (!S.pollTotal) S.poll = DEMO_WORDS.slice(0, n).map((w, i) => [w, Math.max(1, Math.round(16 / (1 + i * .42)))]); }

/* ============ Background: drifting network of light, like the Summit artwork ============ */
const cv = $('bg'), cx = cv.getContext('2d'); let nodes = [], orbs = [], pulses = [], lastTotal = -1, lastFrame = 0, bgN = 0;
const particleMax = () => GOV.lite ? 30 : 80; // effect particles alive at once
function initBg(){
  const k = Math.min(1, 1600 / innerWidth); cv.width = innerWidth * k; cv.height = innerHeight * k; cx.setTransform(k, 0, 0, k, 0, 0);
  bgN = Math.round(Math.max(10, Math.min(26, innerWidth / 160)));
  nodes = Array.from({length:GOV.lite ? Math.ceil(bgN / 2) : bgN}, () => ({x:Math.random() * innerWidth, y:Math.random() * innerHeight * .9, vx:(Math.random() - .5) * .12, vy:(Math.random() - .5) * .08, r:Math.random() * U * 2.2 + U * .8, ph:Math.random() * 6.28}));
  orbs = Array.from({length:4}, (_, i) => ({x:innerWidth * (.15 + i * .25), y:innerHeight * (.2 + (i % 2) * .4), r:Math.max(innerWidth, innerHeight) * (.12 + Math.random() * .08), ph:Math.random() * 6.28}));
}
function bgLoop(t){
  requestAnimationFrame(bgLoop); if (t - lastFrame < 33) return; lastFrame = t;
  if (GOV.lite && nodes.length > Math.ceil(bgN / 2)) { nodes.length = Math.ceil(bgN / 2); pulses = pulses.filter(q => q.a < nodes.length && q.b < nodes.length); }
  const W = innerWidth, H = innerHeight, s = t / 1000, dark = document.documentElement.dataset.theme === 'dark';
  cx.clearRect(0, 0, W, H);
  const lc = dark ? '120,190,215' : '255,255,255';
  orbs.forEach(o => { const a = (dark ? .05 : .55) * (.7 + .3 * Math.sin(s * .3 + o.ph)); const g = cx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r); g.addColorStop(0, `rgba(${dark ? '48,157,196' : '255,255,255'},${a})`); g.addColorStop(1, `rgba(${dark ? '48,157,196' : '255,255,255'},0)`); cx.fillStyle = g; cx.fillRect(o.x - o.r, o.y - o.r, o.r * 2, o.r * 2); });
  nodes.forEach(p => { p.x += p.vx; p.y += p.vy; if (p.x < -50 || p.x > W + 50) p.vx *= -1; if (p.y < -50 || p.y > H * .95) p.vy *= -1; });
  const D = Math.max(W, H) * .42; cx.lineWidth = Math.max(1.5, U * .25);
  for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) { const a = nodes[i], b = nodes[j], d = Math.hypot(a.x - b.x, a.y - b.y); if (d < D) { cx.strokeStyle = `rgba(${lc},${((1 - d / D) * (dark ? .25 : .9)).toFixed(3)})`; cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); cx.stroke(); } }
  nodes.forEach(p => { const r = p.r * (1 + .25 * Math.sin(s * .8 + p.ph)); const g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 2.2); g.addColorStop(0, `rgba(255,255,255,${dark ? .5 : 1})`); g.addColorStop(.35, `rgba(255,255,255,${dark ? .25 : .7})`); g.addColorStop(1, 'rgba(255,255,255,0)'); cx.fillStyle = g; cx.beginPath(); cx.arc(p.x, p.y, r * 2.2, 0, 6.29); cx.fill(); });
  pulses = pulses.filter(q => q.t < 1);
  pulses.forEach(q => { q.t += .01; const a = nodes[q.a], b = nodes[q.b]; if (!a || !b) return; const x = a.x + (b.x - a.x) * q.t, y = a.y + (b.y - a.y) * q.t; const g = cx.createRadialGradient(x, y, 0, x, y, U * 2.4); g.addColorStop(0, q.c); g.addColorStop(1, 'rgba(255,255,255,0)'); cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, U * 2.4, 0, 6.29); cx.fill(); });
}
function burst(n){ for (let i = 0; i < n && nodes.length > 2 && pulses.length < particleMax(); i++) { const a = Math.floor(Math.random() * nodes.length); let b = (a + 1 + Math.floor(Math.random() * (nodes.length - 1))) % nodes.length; pulses.push({a, b, t:0, c: Math.random() < .5 ? 'rgba(223,98,54,.9)' : 'rgba(47,156,195,.9)'}); } }
function checkSparks(){ const total = SESSIONS.reduce((a, s) => a + s.booked, 0) + SLOTS.filter(x => x.status === 'Booked').length + (S.checkedIn || 0) + (S.pollTotal || 0) + S.photos.length + S.profiles.length; if (lastTotal >= 0 && total > lastTotal) burst(1 + Math.floor((total - lastTotal) / 5)); lastTotal = total; if (Math.random() < .12) burst(1); }

/* ============ Operator keys ============ */
const KEYMODES = {'1':'welcome','2':'opening','3':'video','4':'choose','5':'live','6':'lunch','7':'close'};
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), 2600); }
function help(){ const h = $('help'); h.innerHTML = `<table>${[['F','Full screen'],['0','Automatic, follows the clock'],['1 to 7','Welcome, Opening, Videos, Coffee break, Sessions, Lunch, Thank you'],['Left, Right','Previous or next opening speaker'],['N','Next scene now'],['T','Light or dark'],['A','Type an announcement'],['C','Clear the announcement'],['L','Logo screen'],['B','Black screen'],['K','Screen check, for setting up the wall'],['V','Stop a playing video'],['D','Demo data on or off'],['H','Show or hide this help']].map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`; h.classList.toggle('hide'); }
addEventListener('keydown', e => { const k = e.key.toLowerCase();
  if (KEYMODES[k]) { S.override = KEYMODES[k]; S.speaker = null; loop(true); toast('Held on ' + ({welcome:'welcome', opening:'opening', video:'videos', choose:'coffee break', live:'sessions', lunch:'lunch', close:'thank you'}[S.override]) + ', press 0 to follow the clock'); }
  else if (k === '0') { S.override = null; S.speaker = null; loop(true); toast('Automatic, following the clock'); }
  else if (k === 'arrowright' || k === 'arrowleft') { const m = nowMin(); let i = S.speaker; if (i === null) { i = 0; SPEAKERS.forEach((s, j) => { if (m >= toMin(s.s)) i = j; }); } S.speaker = Math.max(0, Math.min(SPEAKERS.length - 1, i + (k === 'arrowright' ? 1 : -1))); slotState.forEach(st => { if (st.id === 'speaker') showScene(st, true); }); }
  else if (k === 'n') { slotState.forEach(st => { if (st.scenes.length > 1) { st.idx++; st.since = Date.now(); showScene(st, true); } }); }
  else if (k === 't') { S.theme = wantedTheme() === 'dark' ? 'light' : 'dark'; S.urlTheme = null; S.sheetTheme = ''; applyTheme(true); toast(S.theme === 'dark' ? 'Dark' : 'Light'); }
  else if (k === 'a') { const t = prompt('Announcement for the screen', S.ann); if (t !== null) { S.ann = t.trim(); S.annAt = Date.now(); S.annUntil = S.ann ? Date.now() + 20000 : 0; updateTicker(); } }
  else if (k === 'k') { setOverlay(S.overlay === 'check' ? null : 'check'); }
  else if (k === 'v') stopVideo();
  else if (k === 'c') { S.ann = ''; S.annUntil = 0; updateTicker(); }
  else if (k === 'l') $('logo').classList.toggle('hide');
  else if (k === 'b') $('black').classList.toggle('hide');
  else if (k === 'f') { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }
  else if (k === 'd') { S.demo = !S.demo; if (!S.demo) { if (!S.pollTotal) S.poll = []; S.checkedIn = null; SESSIONS.forEach(s => s.booked = 0); SLOTS.forEach(x => x.status = 'Open'); } refresh(); }
  else if (k === 'h' || k === '?') help(); });

/* ============ Main loop ============ */
function loop(force){
  if (WD.frozen) return; // tests only: stands for a main loop that stopped
  demo();
  const mode = S.override || S.remoteMode || S.sheetScene || autoMode(nowMin());
  const modeChanged = mode !== S.mode; S.mode = mode;
  applyTheme(!!S.started);
  const rebuilt = buildStage() || modeChanged;
  const dk = dataSig();
  if (!rebuilt && (force || dk !== S.dataKey)) refreshScenes(); else if (rebuilt) renderRail();
  S.dataKey = dk;
  slotState.forEach(st => {
    if (st.res && st.res.tick && Date.now() - st.sub > st.res.tick * 1000) { st.sub = Date.now(); if (st.res.onTick(st.el.querySelector('.sb'))) showScene(st, true); }
    if (st.scenes.length > 1 && Date.now() - st.since > dwell(st.id) * 1000) { st.idx++; st.since = Date.now(); showScene(st, true); }
    const on = st.el.querySelector('.pager span.on'); if (on) on.style.setProperty('--p', Math.min(1, (Date.now() - st.since) / (dwell(st.id) * 1000)).toFixed(3));
  });
  nowZone(); garden(); moments(); updateTicker(); checkSparks();
  reloadPending();
  WD.tick = Date.now();
}

/* ============ Keeping the wall alive all day ============ */
// Errors go into the next heartbeat. Only script errors: a missing image is not an error of the wall.
const ERR = {last:''};
addEventListener('error', e => { ERR.last = String(e.message || 'Script error') + (e.lineno ? ' at line ' + e.lineno : ''); });
addEventListener('unhandledrejection', e => { const r = e.reason; ERR.last = 'Promise: ' + String(r && r.message || r); });
// Watchdog: the main loop marks WD.tick every second. If it has not for 20 seconds while the page is
// visible, the page reloads. After a watchdog reload it waits 60 seconds, so a fault cannot reload in a tight loop.
const WD = {tick:Date.now(), frozen:false};
setInterval(() => {
  if (document.visibilityState !== 'visible') { WD.tick = Date.now(); return; }
  const last = +ss('md_wd') || 0, limit = Date.now() - last < 120000 ? 60000 : 20000;
  if (Date.now() - WD.tick > limit) { ss('md_wd', Date.now()); location.reload(); }
}, 2000);
document.addEventListener('visibilitychange', () => { WD.tick = Date.now(); if (document.visibilityState === 'visible') wake(); });
// Keep the screen on (Chrome on the wall computer).
async function wake(){ try { if (navigator.wakeLock && document.visibilityState === 'visible' && !(S.wake && !S.wake.released)) S.wake = await navigator.wakeLock.request('screen'); } catch(e) {} }
// Heartbeat for the remote's Status tab: what the wall shows and how it runs. First one soon after load.
function beatBody(){ return {w:innerWidth, h:innerHeight, dpr:devicePixelRatio || 1, layout:(L.wide ? 'wide' : 'standard') + ' ' + L.n, mode:S.mode, scenes:slotState.map(s => s.id).filter(Boolean).slice(0, 8), lite:GOV.lite, fps:GOV.fps, err:ERR.last.slice(0, 280), at:nowMs()}; }
async function beat(){
  if (!location.protocol.startsWith('http')) return;
  const b = beatBody(), sent = ERR.last;
  try { const r = await fetch('/api/beat', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(b), keepalive:true}); if (r.ok && ERR.last === sent) ERR.last = ''; } catch(e) {}
}
function logos(){
  const h = U;
  $('logos').innerHTML = `<div><img src="${A.mc}" style="height:${h * 4.2}px" alt="Mercy Corps"><img src="${A.gsg}" style="height:${h * 3.4}px" alt="Gaza Sky Geeks"><img src="${A.sida}" style="height:${h * 3.3}px" alt="Sweden Sverige"></div><div style="justify-content:flex-start;gap:${h * 3}px"><img src="${A.tp}" style="height:${h * 6.6}px" alt="Palestine TechnoPark"><img src="${A.pis}" style="height:${h * 4.8}px" alt="Palestine Innovation Summit"></div>`;
  $('logo').innerHTML = `<div style="display:flex;align-items:center;gap:${h * 6}px"><img src="${A.mc}" style="height:${h * 9}px"><img src="${A.gsg}" style="height:${h * 7.5}px"><img src="${A.sida}" style="height:${h * 7}px"><img src="${A.tp}" style="height:${h * 15}px"><img src="${A.pis}" style="height:${h * 10}px"></div>`;
}
function resize(){ L = layout(); S.plan = ''; gardenKey = ''; initBg(); logos(); joinBlock(); tkHtml = ''; if (S.overlay === 'check') renderCheck(); loop(true); }

restore(); S.mode = S.override || autoMode(nowMin()); document.documentElement.dataset.theme = wantedTheme();
resize(); S.started = true;
addEventListener('resize', resize);
setInterval(() => loop(false), 1000);
setInterval(nowZone, 250);
initVideo(); setConn(); refresh(); setInterval(refresh, CONFIG.refreshSeconds * 1000);
if (location.protocol.startsWith('http')) { pullState(); setInterval(pullState, CONFIG.stateSeconds * 1000); setTimeout(beat, 8000); setInterval(beat, CONFIG.beatSeconds * 1000); }
requestAnimationFrame(bgLoop); requestAnimationFrame(tickerLoop);
wake();
if (!P.has('quiet')) setTimeout(() => toast('Press F for full screen and H for controls'), 1200);
// For probes and tests (scripts/probe.cjs, scripts/wall-check.cjs). Reading it changes nothing.
window.__md = {S, slotState, GOV, RELOAD, CLOCK, WD, ERR, L:() => L, venue, nowMin, beatBody, bg:() => ({nodes:nodes.length, full:bgN, pulses:pulses.length, max:particleMax()}),
  force(id){ if (!R[id]) return -1; let i = slotState.findIndex(st => st.scenes.includes(id)); if (i < 0) i = 0; const st = slotState[i]; if (!st) return -1; if (!st.scenes.includes(id)) st.scenes.push(id); st.idx = st.scenes.indexOf(id); st.since = Date.now(); showScene(st, true); return i; }};
})();
</script>
