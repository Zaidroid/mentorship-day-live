<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mentorship Day Live Screen</title>
<link rel="preload" href="/assets/ss3-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:SS3;font-weight:300;src:url(/assets/ss3-300.woff2) format('woff2')}
@font-face{font-family:SS3;font-weight:400;src:url(/assets/ss3-400.woff2) format('woff2')}
@font-face{font-family:SS3;font-weight:600;src:url(/assets/ss3-600.woff2) format('woff2')}
@font-face{font-family:SS3;font-weight:700;src:url(/assets/ss3-700.woff2) format('woff2')}
@font-face{font-family:SS3;font-weight:900;src:url(/assets/ss3-900.woff2) format('woff2')}
/* Noto Sans Arabic 400 and 700 (SIL Open Font License, /assets/noto-ar-OFL.txt), copied from @fontsource/noto-sans-arabic 5.3.0.
   After SS3 in every stack: it loads only when Arabic text shows (unicode-range), for names and answers typed in Arabic. */
@font-face{font-family:NotoAr;font-weight:400;font-display:swap;src:url(/assets/noto-ar-400.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:NotoAr;font-weight:700;font-display:swap;src:url(/assets/noto-ar-700.woff2) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
/* Motion tokens (docs/PLAN.md 7.2). The same values live in M in the script. */
:root{--red:#DF6236;--teal:#2F9CC3;--navy:#1F2E33;--orange:#E78B3F;--u:10px;--ease:cubic-bezier(.2,.8,.2,1);--ease-io:cubic-bezier(.65,0,.25,1);--t-s:240ms;--t-e:520ms;--t-x:900ms}
[data-theme=light]{--glass-solid:rgba(250,250,250,.86);--bg1:#E3E3E3;--bg2:#F7F7F7;--ink:#1F2E33;--ink2:rgba(31,46,51,.70);--ink3:rgba(31,46,51,.44);--line:rgba(31,46,51,.14);--glass:rgba(255,255,255,.64);--glassline:rgba(255,255,255,.95);--shadow:0 calc(var(--u)*.6) calc(var(--u)*2.6) rgba(31,46,51,.07);--soft2:rgba(31,46,51,.08);--chip:transparent;--redsoft:rgba(223,98,54,.12)}
[data-theme=dark]{--glass-solid:rgba(41,55,60,.86);--bg1:#1F2E33;--bg2:#162226;--ink:#FFFFFF;--ink2:rgba(255,255,255,.72);--ink3:rgba(255,255,255,.44);--line:rgba(255,255,255,.14);--glass:rgba(255,255,255,.06);--glassline:rgba(255,255,255,.10);--shadow:none;--soft2:rgba(255,255,255,.10);--chip:#FFFFFF;--redsoft:rgba(223,98,54,.22)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;color:var(--ink);font-family:SS3,NotoAr,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;background:linear-gradient(180deg,var(--bg1),var(--bg2));transition:color var(--t-x) var(--ease)}
/* Masked text: each line sits in its own clip and rises from behind its lower edge. The clip reaches past
   the line box so descenders are never cut, and is lifted (.ok) once the line has arrived. */
/* Custom tags, so no rule written for spans (.join span, .qrtxt span) can reach them. */
m-l{display:block;overflow:hidden;padding:.12em 0 .2em;margin:-.12em 0 -.2em}
m-l.ok{overflow:visible}
m-i{display:inline-block;white-space:nowrap}
m-i.lb{display:block;white-space:inherit}
m-w{display:inline}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block}
#app{position:fixed;inset:0;display:grid;grid-template-columns:calc(var(--u)*var(--nowW)) minmax(0,1fr) calc(var(--u)*var(--railW));grid-template-rows:minmax(0,1fr) calc(var(--u)*11.5) calc(var(--u)*8.2);column-gap:calc(var(--u)*3);padding:calc(var(--u)*3.2) calc(var(--u)*3.4) 0}
#app[data-layout=standard]{grid-template-columns:calc(var(--u)*var(--nowW)) minmax(0,1fr) 0}
#app[data-layout=standard] #rail{display:none}
.glass{background:var(--glass);border:1px solid var(--glassline);border-radius:10px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.leaf{border-radius:calc(var(--u)*.7) calc(var(--u)*3) 0 calc(var(--u)*3)}
/* lite: set by the performance governor. Glass becomes a solid fill, no backdrop blur anywhere */
[data-lite] .glass:not(.free){backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--glass-solid)}
[data-lite] *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}

/* Now zone */
/* Every part of #app has a fixed place in the grid, so the moment can lie over the stage and the rail
   without pushing them out of their cells. */
#now{grid-row:1;grid-column:1;display:flex;flex-direction:column;min-height:0;padding:calc(var(--u)*2.6) calc(var(--u)*2.8) calc(var(--u)*2.4)}
.wm h1{font-weight:700;font-size:calc(var(--u)*4.4);line-height:1;color:var(--red);letter-spacing:-.01em;white-space:nowrap}
.wm i{display:block;height:calc(var(--u)*.55);background:var(--teal);margin-top:calc(var(--u)*1.2);width:100%}
.wm span{display:block;font-size:calc(var(--u)*1.6);color:var(--ink2);margin-top:calc(var(--u)*1.1)}
.clock{margin-top:auto;font-weight:300;font-size:calc(var(--u)*14.5);line-height:.82;letter-spacing:-.035em;display:flex;align-items:flex-start;color:var(--ink)}
.clock sup{font-size:.26em;font-weight:600;letter-spacing:0;color:var(--ink3);margin:calc(var(--u)*1) 0 0 calc(var(--u)*.9)}
.status{margin-top:calc(var(--u)*3.2)}
.st-label{display:flex;align-items:center;gap:calc(var(--u)*1);font-weight:700;font-size:calc(var(--u)*2.6);line-height:1.1}
.st-label.on{color:var(--red)}
.live-dot{width:calc(var(--u)*1.2);height:calc(var(--u)*1.2);border-radius:50%;background:var(--red);flex:none;position:relative}
.live-dot:after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--red);animation:ping 2s var(--ease) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.6}80%,100%{transform:scale(2.6);opacity:0}}
.st-cd{display:flex;align-items:baseline;gap:calc(var(--u)*1.2);margin-top:calc(var(--u)*1.2)}
.st-cd b{font-weight:300;font-size:calc(var(--u)*7);line-height:1;letter-spacing:-.02em}
.st-cd span{font-size:calc(var(--u)*1.8);color:var(--ink2)}
.prog{height:calc(var(--u)*.55);background:var(--soft2);overflow:hidden;margin-top:calc(var(--u)*1.5)}
.prog i{display:block;height:100%;width:0;background:var(--red);transition:width 1s linear}
.st-next{margin-top:calc(var(--u)*1.7);font-size:calc(var(--u)*1.8);color:var(--ink2);line-height:1.35}
.st-next b{color:var(--ink);font-weight:700}
.logos{margin-top:auto;display:flex;flex-direction:column;gap:calc(var(--u)*1.4);padding-top:calc(var(--u)*2.4)}
.logos div{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*1.6);background:var(--chip);border-radius:10px;padding:calc(var(--u)*.4) calc(var(--u)*.6)}
.logos img{display:block;width:auto}

/* Stage */
#stage{grid-row:1;grid-column:2;position:relative;min-width:0;min-height:0;display:flex;gap:calc(var(--u)*3)}
.slot{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
.sh{display:flex;align-items:flex-end;gap:calc(var(--u)*2);margin:calc(var(--u)*.6) 0 calc(var(--u)*2.2)}
.sh h2{font-weight:700;font-size:calc(var(--u)*3.4);line-height:1;color:var(--red);white-space:nowrap}
.sh .rule{position:absolute}
.pager{margin-left:auto;display:flex;gap:calc(var(--u)*1.8);font-size:calc(var(--u)*1.5);font-weight:600;color:var(--ink3)}
.pager span{position:relative;padding-bottom:calc(var(--u)*.7);white-space:nowrap;transition:color var(--t-s) var(--ease)}
.pager span.on{color:var(--ink)}
.pager .segs{display:flex;gap:calc(var(--u)*.6);margin-bottom:calc(var(--u)*.4)}
.pager .segs span{width:calc(var(--u)*2.6);height:3px;padding:0;background:var(--soft2)}
.pager span.on:after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--teal);transform-origin:left;transform:scaleX(var(--p,0));transition:transform 1s linear}
.shrule{height:calc(var(--u)*.4);background:var(--teal);margin:calc(var(--u)*-1) 0 calc(var(--u)*2.4);width:calc(var(--u)*12)}
.sb{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}

/* shared */
.av{border-radius:50%;object-fit:cover;flex:none;background:var(--soft2);display:grid;place-items:center;font-weight:700;color:var(--ink2);box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.dl{display:inline-flex;align-items:center;gap:calc(var(--u)*.6);font-size:calc(var(--u)*1.5);font-weight:600;color:var(--ink2);white-space:nowrap}
.dl:before{content:"";width:calc(var(--u)*.9);height:calc(var(--u)*.9);border-radius:50%;background:var(--red)}
.dl.on:before{background:var(--teal)}
.pill{display:inline-flex;align-items:center;font-weight:700;color:#fff;background:var(--red);white-space:nowrap;line-height:1}
.pill.blue{background:var(--teal)}
.pill.ghost{background:transparent;color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.pill.ghost.blue{color:var(--teal);box-shadow:inset 0 0 0 2px var(--teal)}
.pill.mute{background:var(--soft2);color:var(--ink3)}
.bar{height:calc(var(--u)*.5);background:var(--soft2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);transition:width var(--t-x) var(--ease)}
.bar.hot i{background:var(--red)}
.muted{color:var(--ink2)}

/* rooms */
.rooms{display:grid;flex:1;min-height:0;gap:calc(var(--u)*2)}
.room{display:flex;flex-direction:column;gap:calc(var(--u)*1.4);min-height:0;min-width:0;padding:calc(var(--u)*2.2) calc(var(--u)*2.4)}
.room .top{display:flex;align-items:center;gap:calc(var(--u)*1.4);flex-wrap:wrap}
.room .top .pill{font-size:calc(var(--u)*2.2);padding:calc(var(--u)*1) calc(var(--u)*2)}
.room .top em{font-style:normal;font-weight:600;font-size:calc(var(--u)*1.6);color:var(--ink2)}
.room .top em.on{color:var(--red)}
.room .ttl{font-weight:700;line-height:1.13;text-wrap:balance}
.room .who{display:flex;align-items:center;gap:calc(var(--u)*1.2);margin-top:calc(var(--u)*.4)}
.room .who b{display:block;font-weight:700;font-size:calc(var(--u)*1.85);line-height:1.15}
.room .who span{display:block;font-size:calc(var(--u)*1.4);color:var(--ink2);line-height:1.25}
.room .seats{margin-top:auto;display:flex;align-items:center;gap:calc(var(--u)*1.2);font-size:calc(var(--u)*1.45);color:var(--ink2)}
.room .seats .bar{flex:1}
.room.free{background:transparent;border:2px dashed var(--line);box-shadow:none;backdrop-filter:none}
.room.free .ttl{color:var(--ink3);font-weight:600;font-size:calc(var(--u)*2)}
.room.live{box-shadow:var(--shadow),inset 0 calc(var(--u)*.5) 0 var(--red)}
.room .foot{margin-top:auto;display:flex;flex-direction:column;gap:calc(var(--u)*1.2)}
.room .foot .seats{margin-top:0}
.room.done .ttl{color:var(--ink2)}
/* planning to join: blue, it is about what comes next */
.plan{display:flex;align-items:baseline;gap:calc(var(--u)*.6);font-size:calc(var(--u)*1.6);font-weight:600;color:var(--ink2)}
.plan b{font-weight:700;color:var(--teal)}
.plan.big{gap:calc(var(--u)*1)}
.plan.big b{font-weight:300;font-size:calc(var(--u)*4.6);line-height:.8;letter-spacing:-.02em}
/* the 45 minutes of a live session */
.lbar{height:calc(var(--u)*.45);background:var(--soft2);overflow:hidden}
.lbar i{display:block;height:100%;background:var(--red);transition:width 1s linear}
.stack{display:flex}
.stack>*+*{margin-left:calc(var(--u)*-1.4)}

/* choose grid */
.cg{display:grid;flex:1;min-height:0}
.cg .hd{padding:0 calc(var(--u)*.7) calc(var(--u)*1.2)}
.cg .hd .pill{font-size:calc(var(--u)*1.9);padding:calc(var(--u)*.9) calc(var(--u)*1.8);width:100%}
.cg .tm{border-top:1px solid var(--line);padding:calc(var(--u)*1.4) calc(var(--u)*1) 0 0}
.cg .tm b{display:block;font-weight:700;font-size:calc(var(--u)*3.2);line-height:1}
.cg .c{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:calc(var(--u)*1.4);display:flex;flex-direction:column;gap:calc(var(--u)*.8);min-height:0;overflow:hidden}
.cg .c .s{font-weight:700;font-size:calc(var(--u)*1.9);line-height:1.15;text-wrap:balance}
.cg .c .p{display:flex;align-items:center;gap:calc(var(--u)*.8);font-size:calc(var(--u)*1.5);color:var(--ink2);margin-top:auto}
.cg .c .m{display:flex;align-items:center;flex-wrap:wrap;gap:calc(var(--u)*.5) calc(var(--u)*1.2);font-size:calc(var(--u)*1.4);color:var(--ink2)}
.cg .c .m .bar{flex:1 1 calc(var(--u)*4)}
.cg .c .m .plan{font-size:calc(var(--u)*1.4)}
/* narrow cells (the wall at 2 to 1 has five columns in about 80 U) */
.cg.tight .c .s{font-size:calc(var(--u)*1.7)}
.cg.tight .c{padding:calc(var(--u)*1.2)}
.cg .c.free{color:var(--ink3);font-size:calc(var(--u)*1.6);justify-content:center}

/* one to one chips */
.oo{display:flex;flex-direction:column;gap:calc(var(--u)*1.5)}
.oo-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:calc(var(--u)*1.2)}
.oo-who{display:flex;align-items:center;gap:calc(var(--u)*1);min-width:0}
.oo-who b{font-weight:700;font-size:calc(var(--u)*1.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.oo-who span{font-size:calc(var(--u)*1.3);color:var(--ink2);display:block;white-space:nowrap}
.chips{display:flex;gap:calc(var(--u)*.6)}
.chp{width:calc(var(--u)*6.4);height:calc(var(--u)*3.4);border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:calc(var(--u)*1.45);border:2px solid var(--teal);color:var(--ink);background:rgba(255,255,255,.5);transition:border-color var(--t-e) var(--ease),background-color var(--t-e) var(--ease),color var(--t-e) var(--ease)}
.chips.sm .chp{width:calc(var(--u)*5.6);height:calc(var(--u)*3.1);font-size:calc(var(--u)*1.35)}
.chp.taken{border-color:transparent;background:var(--soft2);color:var(--ink3)}
.chp.now{border-color:var(--red);background:var(--red);color:#fff}
.chp.done{border-color:transparent;background:transparent;color:var(--ink3);text-decoration:line-through}
.legend{display:flex;gap:calc(var(--u)*1.8);font-size:calc(var(--u)*1.35);color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:calc(var(--u)*1.3);height:calc(var(--u)*1.3);border-radius:3px;margin-right:calc(var(--u)*.5);vertical-align:-.12em;border:2px solid var(--teal)}
.legend i.t{border-color:transparent;background:var(--soft2)}
.legend i.n{border-color:var(--red);background:var(--red)}

/* rail */
#rail{grid-row:1;grid-column:3;display:flex;flex-direction:column;gap:calc(var(--u)*1.8);min-height:0}
.mod{padding:calc(var(--u)*2) calc(var(--u)*2.2)}
.mod h3{display:flex;align-items:baseline;justify-content:space-between;font-weight:700;font-size:calc(var(--u)*2.1);margin-bottom:calc(var(--u)*1.6)}
.mod h3 em{font-style:normal;font-weight:300;font-size:calc(var(--u)*3.8);line-height:.8;color:var(--teal)}
.mod .foot{margin-top:calc(var(--u)*1.4);font-size:calc(var(--u)*1.45);color:var(--ink2)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*1.8)}
.kpi b{display:block;font-weight:300;font-size:calc(var(--u)*5.2);line-height:.9;letter-spacing:-.02em}
.kpi span{display:block;font-size:calc(var(--u)*1.45);color:var(--ink2);margin-top:calc(var(--u)*.7)}
.qrrow{display:flex;gap:calc(var(--u)*1.8);align-items:center}
.qr{background:#fff;border-radius:10px;padding:calc(var(--u)*.9);flex:none;box-shadow:var(--shadow)}
.qr svg{display:block;width:100%;height:100%}
/* the QR block of the moment: a soft ring every 20 seconds */
.qr.ping{position:relative}
.qr.ping:after{content:"";position:absolute;inset:calc(var(--u)*-.25);border:calc(var(--u)*.3) solid var(--red);border-radius:12px;opacity:0;pointer-events:none;animation:qrping 20s var(--ease) 3s infinite}
@keyframes qrping{0%{opacity:.8;transform:scale(1)}7%{opacity:0;transform:scale(1.16)}100%{opacity:0;transform:scale(1.16)}}
.qrph{flex:none;border:2px dashed var(--ink3);border-radius:10px;display:grid;place-items:center;text-align:center;color:var(--ink3);font-weight:700;font-size:calc(var(--u)*1.4);line-height:1.3}
.qrtxt b{display:block;font-weight:700;font-size:calc(var(--u)*2);line-height:1.2}
.qrtxt span{display:block;font-size:calc(var(--u)*1.5);color:var(--ink2);margin-top:calc(var(--u)*.6);line-height:1.3}

/* spotlight */
.spot{flex:1;display:grid;align-items:center;gap:calc(var(--u)*3.6)}
/* .pic, not .ph: .ph is the Photo Wall tile, whose rules collapsed this box in version 1 */
.spot .pic{position:relative;justify-self:center}
.spot .pic svg.ring{position:absolute;inset:calc(var(--u)*-1.3);width:calc(100% + var(--u)*2.6);height:calc(100% + var(--u)*2.6);transform:rotate(-90deg)}
.spot .pic svg.ring circle{fill:none;stroke-width:1.4}
@keyframes ring{to{stroke-dashoffset:0}}
.spot .pic .av{box-shadow:0 calc(var(--u)*1) calc(var(--u)*3) rgba(31,46,51,.18)}
.spot .kick{font-size:calc(var(--u)*1.9);color:var(--ink2)}
.spot .nm{font-weight:700;font-size:calc(var(--u)*5.4);line-height:1;letter-spacing:-.01em;color:var(--red);margin-top:calc(var(--u)*.6)}
.spot .rule{height:calc(var(--u)*.45);background:var(--teal);width:calc(var(--u)*14);margin-top:calc(var(--u)*1.6)}
.spot .rl{font-size:calc(var(--u)*1.9);color:var(--ink2);margin-top:calc(var(--u)*1.4)}
.spot .ss{font-weight:700;font-size:calc(var(--u)*2.6);line-height:1.2;margin-top:calc(var(--u)*2.2);text-wrap:balance}
.spot .meta{display:flex;gap:calc(var(--u)*1.4);align-items:center;margin-top:calc(var(--u)*1.8);flex-wrap:wrap}
.spot .meta .pill{font-size:calc(var(--u)*1.7);padding:calc(var(--u)*.7) calc(var(--u)*1.5)}
.spot .count{margin-top:calc(var(--u)*2.4);display:flex;gap:calc(var(--u)*.6)}
.spot .count i{width:calc(var(--u)*2.2);height:3px;background:var(--soft2)}
.spot .count i.on{background:var(--red)}

/* wall */
.wall{flex:1;display:grid;align-content:center;gap:calc(var(--u)*2.4) calc(var(--u)*1.6)}
.wall .w{display:flex;flex-direction:column;align-items:center;text-align:center;gap:calc(var(--u)*.9);transition:transform var(--t-e) var(--ease),opacity var(--t-e) var(--ease)}
.wall .w b{font-size:calc(var(--u)*1.6);font-weight:700;line-height:1.15}
.wall .w span{font-size:calc(var(--u)*1.3);color:var(--ink2)}
.wall .w .av{transition:box-shadow var(--t-e) var(--ease)}
.wall.hl .w{opacity:.45}
.wall.hl .w.on{opacity:1;transform:scale(1.08)}
.wall.hl .w.on .av{box-shadow:0 0 0 3px #fff,0 0 0 7px var(--red)}

/* poll */
.poll{flex:1;min-height:0;display:grid;gap:calc(var(--u)*3)}
.cloud{position:relative;min-height:0;min-width:0}
.cloud span{position:absolute;white-space:nowrap;font-weight:700;line-height:1;transform:translate(-50%,-50%);transition:left var(--t-x) var(--ease),top var(--t-x) var(--ease),font-size var(--t-x) var(--ease)}
/* a new word rises from behind its own edge, like every other text */
.cloud span{padding:.16em 0}
.cloud span.new{overflow:hidden}
.cloud span i{display:inline-block;font-style:normal}
.empty{display:grid;place-items:center;text-align:center;color:var(--ink3);font-size:calc(var(--u)*2);line-height:1.4}

/* hero, speaker, recap */
.hero{flex:1;display:flex;flex-direction:column;justify-content:center}
.hero .k{font-size:calc(var(--u)*3.6);font-weight:400;line-height:1.1}
.hero h1{font-weight:700;line-height:.95;letter-spacing:-.02em;color:var(--red);margin-top:calc(var(--u)*.8)}
.hero .rule{height:calc(var(--u)*.9);background:var(--teal);margin-top:calc(var(--u)*2.6)}
.hero p{font-size:calc(var(--u)*2.5);color:var(--ink);line-height:1.4;margin-top:calc(var(--u)*3);max-width:calc(var(--u)*80)}
.hero .feat{display:flex;gap:calc(var(--u)*3.4);margin-top:calc(var(--u)*3.4);flex-wrap:wrap}
.hero .feat span{display:flex;align-items:center;gap:calc(var(--u)*1.1);font-size:calc(var(--u)*2.2);font-weight:600}
.hero .feat span:before{content:"";width:calc(var(--u)*1.1);height:calc(var(--u)*1.1);border-radius:50%;background:var(--red)}
/* welcome: people here and hellos, variants a and b */
.wv{flex:1;min-height:0;display:grid;align-items:center;column-gap:calc(var(--u)*4)}
.wv .hero{min-width:0}
.herecount{display:flex;align-items:baseline;gap:calc(var(--u)*1.4);margin-top:calc(var(--u)*2.8)}
.herecount b{font-weight:300;line-height:.82;letter-spacing:-.03em;color:var(--ink)}
.herecount span{font-weight:700;line-height:1.1;color:var(--ink)}
.herecount.big{margin-top:0;flex-direction:column;align-items:flex-start;gap:calc(var(--u)*1.2)}
.hellos{position:relative;min-width:0}
.hello{position:absolute;left:0;right:0;top:calc(var(--row)*var(--hs)*2.6)}
.hp{display:inline-flex;align-items:baseline;gap:.28em;max-width:100%;white-space:nowrap;font-size:var(--hs);font-weight:400;line-height:1.2;color:#fff;background:var(--red);padding:.42em .9em .46em;border-radius:calc(var(--u)*.7) calc(var(--u)*3) 0 calc(var(--u)*3)}
.hp b{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis}
.wv.b .wr{min-width:0;display:flex;flex-direction:column;justify-content:center}
.wv.b .wr p{font-size:calc(var(--u)*2.5);line-height:1.4;color:var(--ink)}
.wv.b .wr .rule{height:calc(var(--u)*.6);background:var(--teal);margin:calc(var(--u)*2.6) 0 calc(var(--u)*2.2);width:100%}
.wv.b .hello{top:calc(var(--row)*var(--hs)*1.5);font-size:var(--hs);font-weight:400;line-height:1.15;color:var(--ink);white-space:nowrap}
.wv.b .hello b{font-weight:700;color:var(--red)}
.speaker{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:calc(var(--u)*6)}
.speaker .k{font-size:calc(var(--u)*3);color:var(--ink2)}
.speaker .nm{font-weight:700;line-height:.92;letter-spacing:-.02em;color:var(--red);margin-top:calc(var(--u)*1)}
.speaker .rule{height:calc(var(--u)*.8);background:var(--teal);margin-top:calc(var(--u)*2.4);width:70%}
.speaker .org{font-weight:700;font-size:calc(var(--u)*3.4);margin-top:calc(var(--u)*2.4)}
.speaker .what{font-size:calc(var(--u)*2.4);color:var(--ink2);margin-top:calc(var(--u)*.8)}
.sl{display:flex;flex-direction:column;min-width:calc(var(--u)*40);padding:calc(var(--u)*1.4) calc(var(--u)*2.4)}
.sl>div{display:grid;grid-template-columns:calc(var(--u)*8) 1fr;gap:calc(var(--u)*1.2);padding:calc(var(--u)*1.5) 0;transition:opacity var(--t-e) var(--ease)}
.sl>div+div{border-top:1px solid var(--line)}
.sl>div>b{font-weight:700;font-size:calc(var(--u)*2.2);color:var(--ink2)}
.sl>div strong{display:block;font-weight:700;font-size:calc(var(--u)*2.1)}
.sl>div span{display:block;font-size:calc(var(--u)*1.5);color:var(--ink2)}
.sl>div.past{opacity:.38}
.sl>div.on strong,.sl>div.on>b{color:var(--red)}
.recap{flex:1;display:flex;flex-direction:column;justify-content:center}
.recap .kpis{grid-template-columns:repeat(4,minmax(calc(var(--u)*17),auto));justify-content:start;gap:calc(var(--u)*3);margin-top:calc(var(--u)*4)}
.recap .kpi b{font-size:calc(var(--u)*7.4);color:var(--ink)}

/* garden timeline */
#garden{grid-row:2;grid-column:1/-1;position:relative;margin:0 calc(var(--u)*-3.4)}
.fl{position:absolute;bottom:0;width:calc(var(--u)*3.4);height:calc(var(--u)*8);transform-origin:50% 100%;transition:opacity var(--t-e) var(--ease)}
.fl svg{display:block;width:100%;height:100%}
.fl.past{opacity:.38}
.fl.on{animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.fl-l{position:absolute;bottom:calc(var(--u)*3.4);white-space:nowrap;line-height:1.1;transition:opacity var(--t-e) var(--ease)}
.fl-l b{display:block;font-weight:700;font-size:calc(var(--u)*1.7);overflow:hidden;text-overflow:ellipsis}
.fl-l span{display:block;font-size:calc(var(--u)*1.35);color:var(--ink2);margin-top:calc(var(--u)*.2)}
.fl-l.past{opacity:.45}
.fl-l.on b{color:var(--red)}

/* band with ticker */
#band{grid-row:3;grid-column:1/-1;margin:0 calc(var(--u)*-3.4);display:flex;flex-direction:column;gap:calc(var(--u)*.35)}
.thin{height:calc(var(--u)*.45);background:var(--teal);position:relative}
.thin i{position:absolute;left:0;top:0;bottom:0;background:var(--red);transition:width 1s linear}
#needle{position:absolute;top:50%;width:calc(var(--u)*1.6);height:calc(var(--u)*1.6);margin:calc(var(--u)*-.8) 0 0 calc(var(--u)*-.8);border-radius:50%;background:var(--red);box-shadow:0 0 0 calc(var(--u)*.5) var(--redsoft),0 0 calc(var(--u)*2) rgba(223,98,54,.6);transition:left 1s linear;z-index:2}
.thick{height:calc(var(--u)*4.4);background:var(--teal);position:relative;overflow:hidden}
.tk-in{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;white-space:nowrap;font-size:calc(var(--u)*2);font-weight:600;color:#fff;will-change:transform}
.tk-in span{padding:0 calc(var(--u)*2.4)}
.tk-in i{display:inline-block;width:calc(var(--u)*.7);height:calc(var(--u)*.7);background:#fff;transform:rotate(45deg);opacity:.8}
.tk-in .ann{font-weight:900}
#conn{position:absolute;right:0;top:0;bottom:0;display:flex;align-items:center;gap:calc(var(--u)*.7);padding:0 calc(var(--u)*3) 0 calc(var(--u)*6);background:linear-gradient(90deg,transparent,var(--teal) 35%);font-size:calc(var(--u)*1.3);color:rgba(255,255,255,.85);font-weight:600}
#conn i{width:calc(var(--u)*.8);height:calc(var(--u)*.8);border-radius:50%;background:rgba(255,255,255,.5)}
#conn.live i{background:#fff}
#conn .reh{margin-left:calc(var(--u)*.9);padding:calc(var(--u)*.3) calc(var(--u)*.8);border-radius:calc(var(--u)*.3) calc(var(--u)*1) 0 calc(var(--u)*1);background:#fff;color:var(--teal);font-weight:700}
/* the band brightens with the rate of reactions (--rxg 0 to 1, set by the reactions loop) */
.thick{--rxg:0;filter:brightness(calc(1 + var(--rxg) * .16));box-shadow:0 0 calc(var(--u) * 2.8 * var(--rxg)) calc(var(--u) * .35 * var(--rxg)) rgba(47,156,195,calc(.8 * var(--rxg)))}
/* reactions: drawn shapes rising from the band, above everything but the screen check */
#rx{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:41}
/* the running total of reactions in the now zone, during the Opening */
.rxtot{display:flex;align-items:baseline;gap:calc(var(--u)*1);margin-top:calc(var(--u)*1.1)}
.rxtot b{font-weight:300;font-size:calc(var(--u)*3.4);line-height:.9;letter-spacing:-.02em;color:var(--red)}
.rxtot span{font-size:calc(var(--u)*1.7);font-weight:600;color:var(--ink2)}
.leaves{height:calc(var(--u)*2.2);margin-top:calc(var(--u)*.6)}
.leaves svg{display:block;width:100%;height:100%}

/* moments */
/* A moment covers the stage and, on an ultra wide wall, the rail. What it covers recedes. */
#moment{grid-row:1;grid-column:2;z-index:5;display:none;flex-direction:column;justify-content:center;min-width:0;min-height:0;padding:calc(var(--u)*4) calc(var(--u)*5);overflow:hidden}
#app[data-layout=wide] #moment{grid-column:2 / 4}
#moment.show{display:flex}
#stage,#rail{transition:opacity var(--t-e) var(--ease-io),transform var(--t-e) var(--ease-io)}
#app.mom #stage,#app.mom #rail{opacity:0;transform:scale(.97)}
#moment .k{display:flex;align-items:center;gap:calc(var(--u)*1.2);font-weight:600;font-size:calc(var(--u)*3);color:var(--ink)}
#moment h1{font-weight:700;font-size:calc(var(--u)*10.5);line-height:.92;letter-spacing:-.02em;margin-top:calc(var(--u)*1.6);color:var(--red);text-wrap:balance}
#moment .rule{height:calc(var(--u)*.8);background:var(--teal);margin-top:calc(var(--u)*2.6);width:60%}
#moment p{font-size:calc(var(--u)*2.8);color:var(--ink2);margin-top:calc(var(--u)*2.4)}
#moment .cd{position:relative;font-weight:300;line-height:.84;letter-spacing:-.04em;color:var(--red);margin-top:calc(var(--u)*1.4)}
/* the countdown clip is exactly one line tall; the old and the new number stack in it and move up together */
#moment .cd m-l{height:.84em;padding:.1em 0 .06em;margin:-.1em 0 -.06em;box-sizing:content-box}
#moment .cd m-i{display:block}
/* the last 10 seconds sit in the middle of the panel: the line above, the numeral under it */
#moment.cnt{align-items:center;text-align:center}
#moment.cnt .cd m-l{min-width:1.2em}
#moment .mr{display:flex;gap:calc(var(--u)*3.4);margin-top:calc(var(--u)*4);flex-wrap:wrap}
#moment .mrc{display:flex;align-items:flex-start;gap:calc(var(--u)*1.8);flex:1 1 0;min-width:calc(var(--u)*24);max-width:calc(var(--u)*50)}
#moment .mrt{display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--u)*1);min-width:0}
#moment .mrt .pill{font-size:calc(var(--u)*2);padding:calc(var(--u)*.9) calc(var(--u)*1.8)}
#moment .mrt strong{font-weight:700;font-size:calc(var(--u)*2.2);line-height:1.15;text-wrap:balance}
#moment .mrt .who{font-size:calc(var(--u)*1.7);color:var(--ink2)}
#moment .arr{width:calc(var(--u)*7.6);height:calc(var(--u)*7.6);flex:none;background:var(--red);display:grid;place-items:center}
#moment .arr i{display:grid;place-items:center;width:100%;height:100%}
#moment .arr svg{width:62%;height:62%;animation:nudge 1.6s var(--ease) .9s 2}

.ov{position:fixed;inset:0;z-index:30;display:grid;place-items:center}
#black{background:#000}
#logo{background:linear-gradient(180deg,var(--bg1),var(--bg2))}
#help{background:rgba(31,46,51,.92);color:#fff;font-size:calc(var(--u)*2);line-height:1.75}
#help td{padding:0 calc(var(--u)*1.6)}
#help td:first-child{color:var(--orange);font-weight:700;text-align:right;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(var(--u)*22);transform:translateX(-50%);z-index:25;background:var(--navy);color:#fff;border-radius:10px;padding:calc(var(--u)*1.2) calc(var(--u)*2.2);font-size:calc(var(--u)*1.7);font-weight:600;opacity:0;transition:opacity .5s}
#toast.show{opacity:1}
/* join block in the now zone */
.join{display:flex;align-items:center;gap:calc(var(--u)*1.4);margin-top:calc(var(--u)*2.4)}
.join .qr{padding:calc(var(--u)*.6)}
.join b{display:block;font-weight:700;font-size:calc(var(--u)*2);line-height:1.15}
.join span{display:block;font-size:calc(var(--u)*1.4);color:var(--ink2);margin-top:calc(var(--u)*.4);line-height:1.3}
/* networking board */
.meet{flex:1;min-height:0;display:grid;gap:calc(var(--u)*2.4)}
.card{padding:calc(var(--u)*2.6) calc(var(--u)*2.8);display:flex;flex-direction:column;gap:calc(var(--u)*1.5);min-width:0;min-height:0}
.card .ini{width:calc(var(--u)*8.4);height:calc(var(--u)*8.4);border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:calc(var(--u)*3.2);color:#fff;background:var(--teal);flex:none}
.card .nm{font-weight:700;font-size:calc(var(--u)*4);line-height:1;color:var(--red);letter-spacing:-.01em}
.card .co{font-size:calc(var(--u)*1.9);color:var(--ink2);margin-top:calc(var(--u)*.6)}
.tagrow{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.8);align-items:center}
.tagrow em{font-style:normal;font-size:calc(var(--u)*1.5);color:var(--ink2);width:100%}
.tg{display:inline-flex;align-items:center;font-weight:700;font-size:calc(var(--u)*1.7);padding:calc(var(--u)*.6) calc(var(--u)*1.3);border-radius:calc(var(--u)*.5) calc(var(--u)*1.8) 0 calc(var(--u)*1.8);white-space:nowrap}
.tg.lk{background:var(--redsoft);color:var(--red)}
.tg.of{background:rgba(47,156,195,.15);color:var(--teal)}
.match{margin-top:auto;border-top:1px solid var(--line);padding-top:calc(var(--u)*1.4);font-size:calc(var(--u)*1.7);color:var(--ink2);line-height:1.35}
.match b{color:var(--ink)}
.bal{display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*1.2);min-width:0}
.bal h4{font-weight:700;font-size:calc(var(--u)*2.1);margin-bottom:calc(var(--u)*.4)}
.bal .r{display:grid;grid-template-columns:calc(var(--u)*14) minmax(0,1fr);align-items:center;gap:calc(var(--u)*1.2);font-size:calc(var(--u)*1.6)}
.bal .r b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bal .bars{display:flex;flex-direction:column;gap:3px}
.bal .bars i{display:block;height:calc(var(--u)*.75);border-radius:2px;min-width:3px;transition:width var(--t-x) var(--ease)}
.bal .bars i.lk{background:var(--red)}
.bal .bars i.of{background:var(--teal)}
.names{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.7) calc(var(--u)*1.8);font-size:calc(var(--u)*1.6);color:var(--ink2)}
.names b{color:var(--ink);font-weight:700}
/* photo wall */
.pw{flex:1;min-height:0;display:grid;gap:calc(var(--u)*1.2)}
.ph{position:relative;overflow:hidden;border-radius:10px;background:var(--soft2);min-height:0}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.big img{animation:kb 9s ease-out both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:calc(var(--u)*3.4) calc(var(--u)*2.2) calc(var(--u)*1.8);background:linear-gradient(180deg,transparent,rgba(31,46,51,.8));color:#fff}
.ph .cap b{display:block;font-weight:700;font-size:calc(var(--u)*2.3);line-height:1.2}
.ph .cap span{display:block;font-size:calc(var(--u)*1.6);opacity:.88;margin-top:calc(var(--u)*.3)}
.ph .cap.sm{padding:calc(var(--u)*2.4) calc(var(--u)*1.4) calc(var(--u)*1.1)}
.ph .cap.sm span{font-size:calc(var(--u)*1.35)}
/* live numbers */
.pulse{flex:1;display:grid;align-content:center;gap:calc(var(--u)*3.6) calc(var(--u)*3)}
.pulse .kpi b{font-size:calc(var(--u)*9);color:var(--ink)}
.pulse .kpi:nth-child(3n+1) b{color:var(--red)}
.pulse .kpi span{font-size:calc(var(--u)*1.9)}
.pulse .kpi i{display:block;height:calc(var(--u)*.45);width:calc(var(--u)*6);background:var(--teal);margin-top:calc(var(--u)*1.3)}
/* this way */
.way{flex:1;display:grid;gap:calc(var(--u)*2);align-content:center}
.wy{display:flex;align-items:center;gap:calc(var(--u)*2.4);padding:calc(var(--u)*2.2) calc(var(--u)*2.6);min-width:0}
.wy .arr{width:calc(var(--u)*10);height:calc(var(--u)*10);flex:none;background:var(--red);display:grid;place-items:center}
.wy .arr.blue{background:var(--teal)}
.wy .arr i{display:grid;place-items:center;width:100%;height:100%}
.wy .arr svg{width:62%;height:62%;animation:nudge 1.6s var(--ease) .9s 2}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(calc(var(--u)*.9))}}
.wy b{display:block;font-weight:700;font-size:calc(var(--u)*3.4);line-height:1.05;text-wrap:balance}
.wy span{display:block;font-size:calc(var(--u)*1.8);color:var(--ink2);margin-top:calc(var(--u)*.6)}
.here{display:flex;align-items:center;gap:calc(var(--u)*1.2);font-size:calc(var(--u)*2.2);font-weight:700;margin-bottom:calc(var(--u)*.6)}
.here:before{content:"";width:calc(var(--u)*1.4);height:calc(var(--u)*1.4);border-radius:50%;background:var(--red);box-shadow:0 0 0 calc(var(--u)*.5) var(--redsoft)}
/* poll bars */
.pbars{display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*2);min-width:0}
.pbars .r b{display:flex;justify-content:space-between;gap:calc(var(--u)*2);font-weight:700;font-size:calc(var(--u)*2.3);margin-bottom:calc(var(--u)*.7)}
.pbars .r b span{font-weight:300;color:var(--ink2)}
.pbars .bar{height:calc(var(--u)*1.4)}
/* video and screen check */
#vid{background:#000;z-index:40}
#vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#vid .vmsg{position:relative;color:#fff;font-size:calc(var(--u)*3);font-weight:700;text-align:center}
#check{z-index:45;display:block}
#check .grid i{position:absolute;background:rgba(47,156,195,.45)}
#check .edge{position:absolute;inset:0;border:calc(var(--u)*.5) solid #DF6236}
#check>b{position:absolute;width:calc(var(--u)*8);height:calc(var(--u)*8)}
#check .cross{position:absolute;left:50%;top:50%;width:calc(var(--u)*8);height:calc(var(--u)*8);margin:calc(var(--u)*-4) 0 0 calc(var(--u)*-4);background:linear-gradient(#DF6236,#DF6236) center/2px 100% no-repeat,linear-gradient(#DF6236,#DF6236) center/100% 2px no-repeat}
#check .info{position:absolute;left:50%;top:50%;transform:translate(-50%,calc(var(--u)*6));padding:calc(var(--u)*2.4) calc(var(--u)*3);font-size:calc(var(--u)*1.9);line-height:1.5;max-width:calc(var(--u)*70);background:rgba(255,255,255,.92)}
#check .info strong{display:block;font-size:calc(var(--u)*3);color:var(--red)}

.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app" data-layout="standard">
  <aside id="now" class="glass">
    <div class="wm"><h1>Mentorship Day</h1><i></i><span>Palestine Innovation Summit</span></div>
    <div class="clock" id="clock"></div>
    <div class="status">
      <div class="st-label" id="stLabel"></div>
      <div class="st-cd"><b id="stCd"></b><span id="stCdTxt"></span></div>
      <div class="prog"><i id="stProg"></i></div>
      <div class="st-next" id="stNext"></div>
    </div>
    <div class="rxtot hide" id="rxTot"><b></b><span></span></div>
    <div class="join" id="join"></div>
    <div class="logos" id="logos"></div>
  </aside>
  <main id="stage"></main>
  <aside id="rail"></aside>
  <div id="moment" class="glass"></div>
  <div id="garden"></div>
  <div id="band">
    <div class="thin" id="dayline"><i id="dayfill"></i><div id="needle"></div></div>
    <div class="thick"><div class="tk-in" id="tkIn"></div><div id="conn"><i></i><span id="connTxt"></span></div></div>
    <div class="thin"></div>
    <div class="leaves"><svg aria-hidden="true" preserveAspectRatio="xMinYMid slice" viewBox="0 0 3000 32"><defs><pattern id="lv" width="60" height="32" patternUnits="userSpaceOnUse"><path fill="#DF6236" d="M30,28 C40,27 52,20 60,2 C50,12 38,14 30,28 Z M30,28 C20,27 8,20 0,2 C10,12 22,14 30,28 Z"/></pattern></defs><rect width="3000" height="32" fill="url(#lv)"/></svg></div>
  </div>
</div>
<div class="ov hide" id="black"></div>
<div class="ov hide" id="logo"></div>
<div class="ov hide" id="help"></div>
<div class="ov hide" id="check"></div>
<div class="ov hide" id="vid"><video playsinline preload="auto"></video><div class="vmsg"></div></div>
<canvas id="rx" aria-hidden="true"></canvas>
<div id="toast"></div>
<script src="/assets/qrcode.js"></script>
<script src="/assets/day.js"></script>
<script>
(function(){

function slotsFor(who, room, start, end, mode){ const o = []; for (let m = toMin(start); m + 15 <= toMin(end); m += 15) o.push({who, room, s:fmt(m), e:fmt(m+15), mode, status:'Open'}); return o; }

/* ============ Time ============ */
// The wall shows venue time (MD_DAY.tz), whatever time zone the computer is set to.
// It keeps its own clock, unless a fresh state t differs from it by more than 15 seconds
// (a wrong clock on the wall computer, or a rehearsal): then it runs on Date.now() + skew.
// ?t=HH:MM[:SS] wins over everything. ?speed=N runs the clock faster, for tests.
const P = new URLSearchParams(location.search);
const speed = Math.max(1, +P.get('speed') || 1), t0 = Date.now();
const TZF = (() => { try { return new Intl.DateTimeFormat('en-US', {timeZone:DAY.tz, hourCycle:'h23', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit'}); } catch(e) { return null; } })();
let tzOff = 0, tzAt = -1e13;
function tzOffset(ms){ // venue wall time minus UTC, in ms, looked up again every 10 minutes
  if (Math.abs(ms - tzAt) < 6e5) return tzOff; tzAt = ms;
  if (!TZF) { tzOff = -new Date(ms).getTimezoneOffset() * 60000; return tzOff; }
  const p = {}; TZF.formatToParts(new Date(ms)).forEach(x => { p[x.type] = x.value; });
  tzOff = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second) - Math.floor(ms / 1000) * 1000; return tzOff;
}
let fakeBase = null;
if (P.get('t')) { const [h,m,s] = P.get('t').split(':').map(Number), n = Date.now(), v = new Date(n + tzOffset(n)); fakeBase = Date.UTC(v.getUTCFullYear(), v.getUTCMonth(), v.getUTCDate(), h || 0, m || 0, s || 0) - tzOffset(n); }
const CLOCK = {skew:0, use:false};
function nowMs(){ const off = CLOCK.use ? CLOCK.skew : 0; if (fakeBase !== null) return fakeBase + (Date.now() - t0) * speed; return (speed === 1 ? Date.now() : t0 + (Date.now() - t0) * speed) + off; }
function venue(){ const ms = nowMs(), d = new Date(ms + tzOffset(ms)); return {h:d.getUTCHours(), m:d.getUTCMinutes(), s:d.getUTCSeconds(), ms:d.getUTCMilliseconds(), t:ms}; }
function toMin(s){ const [h,m] = String(s).split(':').map(Number); return h*60 + m; }
function fmt(m){ return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(Math.round(m%60)).padStart(2,'0'); }
function nowMin(){ const v = venue(); return v.h*60 + v.m + v.s/60 + v.ms/60000; }
function mmss(sec){ sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return (h ? h + ':' + String(m).padStart(2,'0') : String(m)) + ':' + String(s).padStart(2,'0'); }

/* ============ Performance governor ============ */
// Frame time is measured for the first 6 seconds (after 1.5 seconds of warm up, while fonts and photos
// load) and then over the last 120 frames. When the average stays over 22 ms for 3 seconds, the wall goes
// lite for the rest of the session: no backdrop blur (glass becomes a solid fill), no blur in reveals,
// half the background nodes, at most 30 effect particles. The background keeps moving.
// ?lite=1 and ?lite=0 force it. Frames are not counted while the page is hidden, and a single gap over 2
// seconds is a stall (a reload, a debugger), not a frame. A slow frame of 300 ms still counts: a wall that
// slow needs lite the most.
const GOV = {force:/^[01]$/.test(P.get('lite') || '') ? P.get('lite') : null, lite:false, why:'', fps:null, avg:0, buf:[], sum:0, t0:0, last:0, slow:0, at:0,
  WARM:1500, FIRST:6000, ROLL:120, LIMIT:22, HOLD:3000};
function goLite(why){ if (GOV.lite) return; GOV.lite = true; GOV.why = why; GOV.at = Date.now(); document.documentElement.dataset.lite = ''; }
function govFrame(t){
  requestAnimationFrame(govFrame);
  if (document.hidden) { GOV.last = 0; return; }
  if (!GOV.t0) { GOV.t0 = GOV.last = t; return; }
  if (!GOV.last) { GOV.last = t; return; } // the first frame after the page was hidden
  const dt = t - GOV.last; GOV.last = t;
  if (t - GOV.t0 < GOV.WARM || dt > 2000) return;
  GOV.buf.push(dt); GOV.sum += dt;
  if (t - GOV.t0 > GOV.WARM + GOV.FIRST) while (GOV.buf.length > GOV.ROLL) GOV.sum -= GOV.buf.shift();
  GOV.avg = GOV.sum / GOV.buf.length; GOV.fps = Math.round(1000 / GOV.avg);
  if (GOV.lite || GOV.force || GOV.buf.length < 10) return;
  if (GOV.avg > GOV.LIMIT) { if (!GOV.slow) GOV.slow = t; else if (t - GOV.slow >= GOV.HOLD) goLite(`average frame ${GOV.avg.toFixed(1)} ms for 3 seconds`); } else GOV.slow = 0;
}
if (GOV.force === '1') goLite('lite=1 in the URL');
requestAnimationFrame(govFrame);

/* ============ State ============ */

const $ = id => document.getElementById(id);

const adv = k => ADVISORS[k] || {name:k, role:'', photo:null};
const initials = n => n.split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase();
function av(k, size){ const a = adv(k); if (a.noPhoto) return ''; const st = `width:calc(var(--u)*${size});height:calc(var(--u)*${size});font-size:calc(var(--u)*${(size*0.36).toFixed(2)})`; return a.photo ? `<img class="av" style="${st}" src="${a.photo}" alt="">` : `<div class="av" style="${st}">${esc(initials(a.name))}</div>`; }

}

function layout(){
  U = Math.min(innerHeight / 100, innerWidth / 177.8);
  const W = innerWidth / U, wide = W >= 262;
  const nowW = wide ? 60 : 54, railW = wide ? 50 : 0;
  const stageW = W - 6.8 - nowW - railW - (wide ? 6 : 3);

}
let L = {wide:false, stageW:100, n:1};
// The slots and the scenes each may show. Roles: pinned (a scene held from the remote or the URL), single
// (one slot does it all), primary (the big slot) and secondary. Which scene shows when is the director's job.
function plan(){
  const pin = P.get('scene') || S.pin; if (pin && R[pin]) return [{role:'pinned', scenes:[pin]}];
  const set = SETS[S.mode], sec = set.s.filter(id => !(L.wide && RAIL_HAS.includes(id)));
  if (!sec.length || L.n === 1) return [{role:'single', scenes:set.p.concat(sec)}];

/* ============ Scenes ============ */
const R = {};
// Choose and Rooms (docs/PLAN.md WP4 task 7). "N planning to join" counts own choices and picks made for people
// (state interest) and shows when N is above zero. Seats left and their bar show only when the tracker has at
// least one booking, so the wall never shows a number nobody counted. A live session has a thin bar for its
// 45 minutes, and in its last 5 minutes the tag reads Wrapping up.
const hasBookings = () => SESSIONS.some(s => s.booked > 0);
const planning = s => +((S.interest || {})[s.id]) || 0;
const planLine = (s, big) => { const n = planning(s); return n > 0 ? `<div class="plan${big ? ' big' : ''}"><b>${n}</b><span>planning to join</span></div>` : ''; };
const seatsLine = s => hasBookings() ? `<div class="seats"><span>${seatsLeft(s)} of ${s.seats} seats left</span><div class="bar ${seatsLeft(s) < 6 ? 'hot' : ''}"><i style="width:${Math.round(100 * s.booked / s.seats)}%"></i></div></div>` : '';
// One room card. state: live (on now), next (starts later), done (ended).
function roomCard(r, b, state, cw, m){
  const s = SESSIONS.find(x => x.b === b.n && x.room === r);
  if (!s) return `<div class="room free glass rv"><div class="top"><span class="pill mute leaf lf">${r}</span></div><div class="ttl tx">No session this hour. Book a one to one at the registration desk.</div></div>`;
  const big = cw > 40, who = s.who.filter(k => !adv(k).noPhoto), wrap = state === 'live' && m >= toMin(b.e) - 5;
  const tag = state === 'live' ? `<em class="on">${wrap ? 'Wrapping up' : 'On now'}</em>` : state === 'done' ? `<em>Ended at ${b.e}</em>` : `<em>Starts at ${b.s}</em>`;
  const pct = Math.max(0, Math.min(100, (m - toMin(b.s)) / (toMin(b.e) - toMin(b.s)) * 100));
  const foot = state === 'live' ? `${planLine(s)}<div class="lbar"><i style="width:${pct.toFixed(1)}%"></i></div>` : state === 'next' ? `${planLine(s, true)}${seatsLine(s)}` : '';

}
// The One to Ones card for a time window: the slot on now, or the next one.

    <div style="display:flex;gap:calc(var(--u)*1.4);flex-wrap:wrap">${dl(ref.mode)}<span class="dl on" style="color:var(--ink2)">${esc(ref.room)}</span></div>

R.rooms = (c) => {

function spotList(){

/* ============ Motion ============ */
// One set of tokens, one treatment per kind of thing, used everywhere (docs/PLAN.md 7.2):
//   scene change    the old scene recedes (to scale .97 and out), the new one comes forward (scale 1.06 to 1, a small rise)
//   blocks   .rv    come forward the same way, 520 ms
//   text     .tx    each line rises from behind its own clipped edge. Text never fades in
//   leaves   .lf    leaf pills unfold from their square corner (bottom right)

// Splits the text of each element into the lines it has now, each line in its own clip (.ln > .li).
// An element with child elements rises as one block. Three passes, so the page lays out once for all.
function splitLines(els){

    if (el.dataset.ln) return; el.dataset.ln = '1';

    if (el.children.length) { el.innerHTML = `<m-l class="ln"><m-i class="li lb">${el.innerHTML}</m-i></m-l>`; return; }
    plain.push(el); el.innerHTML = t.trim().split(/\s+/).map(w => `<m-w>${esc(w)}</m-w>`).join(' ');

  plain.forEach((el, i) => { el.innerHTML = lines[i].map(l => `<m-l class="ln"><m-i class="li">${esc(l.join(' '))}</m-i></m-l>`).join(''); });

const lift = a => { const ln = a.effect.target.parentNode; a.finished.then(() => ln.classList.add('ok'), () => {}); };

function forward(el, delay, dur){ const big = !GOV.lite && el.classList.contains('big'); return el.animate([Object.assign({opacity:0, transform:`translateY(${(U * .8).toFixed(1)}px) scale(1.06)`}, big ? {filter:'blur(8px)'} : {})], {duration:dur || M.e, delay, easing:M.out, fill:'backwards'}); }
function recede(el, dur){ return el.animate([{opacity:1, transform:'none'}, {opacity:0, transform:'scale(.97)'}], {duration:dur || M.e, easing:M.io, fill:'forwards'}); }

  splitLines([...root.querySelectorAll('.tx')]);
  let i = 0; const next = () => Math.min(i++, M.max) * M.stag;
  root.querySelectorAll('.rv,.lf,.dr,.li').forEach(el => {
    const c = el.classList;

function rxSprites(){ const out = {}; RXK.forEach(k => { out[k] = RXC.map(col => { const s = document.createElement('canvas'); s.width = s.height = 128; const c = s.getContext('2d'); c.scale(1.28, 1.28); c.fillStyle = c.strokeStyle = col; rxPath(c, k); return s; }); }); return out; }

// Called with every fresh state. The first one sets what counts as shown, so a reload does not replay the windows.

const rxVideo = () => !$('vid').classList.contains('hide');
const rxBlocked = () => still() || !$('black').classList.contains('hide') || !$('logo').classList.contains('hide');
function rxSpawn(kind, video){

// What arrives beyond the cap: the youngest shape of that kind grows (up to 2.4 times), or the youngest of any kind.

function checkSparks(){ const total = SESSIONS.reduce((a, s) => a + s.booked, 0) + SLOTS.filter(x => x.status === 'Booked').length + (S.checkedIn || 0) + (S.pollTotal || 0) + S.photos.length + S.profiles.length; if (lastTotal >= 0 && total > lastTotal) burst(1 + Math.floor((total - lastTotal) / 5)); lastTotal = total; if (Math.random() < .12) burst(1); }
